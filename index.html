    key = 'buy'; html = buyHTML(); cls = 'felt';
  } else if (game.phase === 'auction' && game.auction) {
    key = 'auction'; html = auctionHTML(); cls = 'felt';
  } else if (game.trade && (
      isBackendAuthoritativeGame()
        ? (backendPlayerMine(game.trade.from) || backendPlayerMine(game.trade.to))
        : (!net.role || game.trade.from === net.myPid || game.trade.to === net.myPid)
    ) && (!game.trade.postponed || ui.reviewingTrade)) {
    // Only the two people involved ever see this dialog: the proposer
    // while they're still picking a partner or building the offer
    // (game.trade.to isn't set yet at that point, so nobody else's
    // net.myPid can match it), and both sides once an offer has
    // actually been sent (stage 'review'). Everyone else keeps seeing
    // the normal board -- a trade someone else is drafting is none of
    // their business until it's actually on the table. Once postponed,
    // this popup gets out of the way entirely for both of them -- see
    // tradeReviewBtnHTML() in the dock for how they reopen it.
    key = 'trade' + game.trade.stage + (game.trade.postponed ? 'postponed' : ''); html = tradeHTML();
  } else if (ui.deeds) {
    key = 'deeds'; html = deedsHTML(); cls = 'wide felt'; extra = 'onclick="scrimClick(event)"';
  } else if (ui.peek !== null) {
    key = 'peek'; html = peekHTML(); cls = 'felt'; extra = 'onclick="scrimClick(event)"';
  }
  const box = $('modal');
  if (!key) { box.innerHTML = ''; modalKey = ''; return; }
  const entering = key !== modalKey;   // only play the open animation when a new dialog appears
  modalKey = key;
  // Note: typing in the trade form does not call render(), so typed numbers survive.
  box.innerHTML = `<div class="scrim" ${extra}><div class="dialog ${cls} ${entering ? 'enter' : ''}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;
  if (entering) { const d = box.querySelector('.dialog'); if (d) d.focus(); }
}

// Animate money changes: floating text over the pill, a flash, a big
// center-screen toast, and a sound.
function animateDiffs() {
  let up = false, down = false;
  game.players.forEach(p => {
    const before = prevMoney[p.id];
    if (before !== undefined && before !== p.money && !p.bankrupt) {
      pillFloat(p.id, p.money - before);
      bigMoneyToast(p, p.money - before);
      if (p.money > before) up = true; else down = true;
    }
    prevMoney[p.id] = p.money;
  });
  if (up || down) playMoneySound();
}
// The big, hard-to-miss center-screen callout. One toast per player
// whose cash changed this render, stacked if more than one changes at
// once (e.g. both sides of a trade). Sized a bit larger for bigger
// swings so a $2,000 hit visually outweighs a $4 utility bill.
function bigMoneyToast(p, delta) {
  const layer = $('bigMoney');
  if (!layer) return;
  const up = delta > 0;
  const mag = Math.min(1, Math.abs(delta) / 500);
  const amountSize = (2.2 + mag * 1.4).toFixed(2) + 'rem';
  const el = document.createElement('div');
  el.className = 'big-money ' + (up ? 'up' : 'down');
  el.innerHTML = `<div class="bm-text"><span class="bm-name">${esc(p.name)}</span><span class="bm-amount" style="font-size:${amountSize}">${up ? '+' : '-'}${fmt(Math.abs(delta))}</span></div>`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), T(2100) + 200);
}
function pillFloat(id, delta) {
  const pill = $('pill' + id), layer = $('hudFloats');
  if (!pill || !layer) return;
  const el = document.createElement('div');
  el.className = 'pfloat ' + (delta > 0 ? 'up' : 'down');
  el.textContent = (delta > 0 ? '+' : '-') + fmt(Math.abs(delta));
  el.style.left = (pill.offsetLeft + pill.offsetWidth / 2) + 'px';
  el.style.top = (pill.offsetTop + pill.offsetHeight) + 'px';
  layer.appendChild(el);
  setTimeout(() => el.remove(), T(1500) + 200);
}

// Draws the whole game screen. Called after every change to "game".
function render() {
  if (!game) { renderSetup(); return; }
  renderCells();
  updateHud();
  updateDock();
  updateCaption();
  updateManage();
  updateModal();
  updateTokens();
  updatePauseOverlay();
  animateDiffs();
  const nc = $('netControls');
  if (nc) nc.innerHTML = (net.role === 'guest' ? `<button class="btn alt" onclick="joinLeave()">Leave game</button>` : '') +
    (net.role === 'host' && !game.over && connStatus[cur().id] === false ? `<button class="btn alt" onclick="hostSkipDisconnected()">Skip ${esc(cur().name)} (offline)</button>` : '');
  if (!busy && !popup && !ui.intro && !net.role && !isBackendAuthoritativeGame()) saveGame();
}

/* =====================================================================
   SECTION 14. SAVE, PLAYER ORDER, SETUP SCREEN AND START
   ===================================================================== */
function saveGame() {
  try {
    if (!game || game.over) localStorage.removeItem(SAVE_KEY);
    else localStorage.setItem(SAVE_KEY, MonopolyGameEngine.serializeState(game));
  } catch (e) { /* saving is optional */ }
}
function loadSaved() {
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? MonopolyGameEngine.deserializeState(raw) : null; } catch (e) { return null; }
}
function resumeGame() {
  const saved = loadSaved();
  if (!saved) return;
  game = saved;
  attachGame();
}

/* Turn order. Everyone gets a random place. The screen shows each
   player and reveals their rank one by one. */
async function orderIntro(order, names, colors) {
  const rows = names.map((n, i) => ({ name: n, color: colors[i], rank: order.indexOf(i) + 1, shown: false, fresh: false }));
  ui.intro = { rows, skip: false };
  busy = true; render();
  await sleep(T(900));
  for (let r = 1; r <= rows.length && !ui.intro.skip; r++) {
    rows.forEach(x => { x.fresh = false; });
    const row = rows.find(x => x.rank === r);
    row.shown = true; row.fresh = true; sfx.card(); render();
    await sleep(T(700));
  }
  if (!ui.intro.skip) await sleep(T(1000));
  ui.intro = null; busy = false; render();
}
function skipIntro() { if (ui.intro) ui.intro.skip = true; }

/* =====================================================================
   SECTION 15. ONLINE PLAY (peer to peer, introduced by name)
   ---------------------------------------------------------------------
   One person hosts under a short lobby name (auto-suggested, editable).
   Everyone else joins by typing their own name and that lobby name --
   no codes to copy and paste. PeerJS's free public broker (a small
   server whose only job is to say "peer A wants to talk to peer B, here
   is how") introduces the two browsers; once that handshake is done,
   the actual game traffic flows directly between the players' browsers,
   the same as before.

   ONE AUTHORITATIVE GAME, NOT FOUR COPIES
   -----------------------------------------
   The host's browser is the only one that ever decides anything random
   (dice rolls, card draws) or accepts a player's move as legal -- and
   the only one that checks whether it was actually that player's turn
   to make it (hostOwnershipOK / expectedActorId below; every guest
   button press is re-checked here, not just hidden in the guest's own
   UI, so a modified or misbehaving guest client cannot act out of turn
   no matter what it sends). But instead of only sending guests the
   *result* of a turn (which would mean their dice just show a number
   with no tumble, their piece just appears on the new square with no
   hop), the host tells every guest which function is about to run
   BEFORE it runs it, and each guest calls that exact same function on
   their own screen -- rollDice, buyProperty, drawCard's card pick, all
   of it. Any random numbers that function needs are streamed to the
   guest live, the instant the host generates each one (see the online
   randomness shim near the top of the script), so the guest is running
   the very same code, on the very same inputs, at essentially the same
   moment as the host -- not several seconds later once the host has
   already finished animating it. Once the action finishes, the host
   also sends its exact resulting game data as a checksum, which every
   guest silently adopts, so any tiny drift heals itself without a
   visible jump. This is hostRun / guestReplay below.

   The lobby (before a game starts) works the same way in spirit: the
   host keeps the one real roster of who is connected, and pushes it to
   every guest whenever it changes, so everyone's waiting-room screen
   agrees on who is there -- including the host's own display name,
   which is kept live (see hostSetName) so it is never stuck showing a
   placeholder like "Host" once the host has typed their real name.

   RECONNECTING
   -------------
   Each browser remembers a random id for itself (localStorage). If a
   guest's connection drops mid-game, they keep trying to reconnect
   automatically; when they get back in, the host recognizes that id,
   puts them back in their same seat, and sends them a fresh snapshot of
   the current game so they can jump back in without missing a beat. A
   disconnected seat's turn simply waits for them -- the host has a
   "Skip their turn" override for when someone is gone for good.

   A NOTE ON WHERE THIS RUNS
   ---------------------------
   This needs the PeerJS script (in the page <head>) to load AND to be
   able to reach its public signaling server over the network. A hosted
   preview's security sandbox can block that kind of outside connection
   entirely. If "Play online" reports it cannot reach anything, download
   this file and open it directly in a browser, or host it yourself --
   outside a sandbox like that, this works normally.
   ===================================================================== */

const HAS_PEER = (typeof Peer !== 'undefined');
// Every player in this browser session (guest or host) keeps a stable
// random id so a dropped connection can reclaim the same seat.
// IMPORTANT: this MUST be sessionStorage, not localStorage. localStorage
// is shared by every tab of the same browser, so if someone hosts in
// one tab and joins their own lobby from a second tab (the obvious way
// to test this before recruiting real friends, and something people
// really do), both tabs would report the exact same clientId. The host
// would then treat the "new" player's hello as the HOST's OWN seat
// reconnecting (see hostFindSeatByClientId below) -- silently merging
// the guest into seat 0 instead of adding a second player, renaming the
// host's seat to the guest's name, and leaving the roster stuck at one
// player forever ("Waiting for at least one friend to join" never
// clears, and Start game never enables, even though the guest thinks
// it successfully joined). sessionStorage is scoped to one tab, so two
// tabs get two different ids, while a single tab reloading or briefly
// losing connection still keeps its own id and can reclaim its seat.
function myClientId() {
  if (net.clientId) return net.clientId;
  try {
    let id = sessionStorage.getItem('monopoly-client-id');
    if (!id) { id = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('monopoly-client-id', id); }
    net.clientId = id;
  } catch (e) { net.clientId = 'c' + Math.random().toString(36).slice(2); }
  return net.clientId;
}
// Turns a display name into a usable PeerJS id: letters, numbers and
// dashes only, so odd characters or emoji in a lobby name still work.
function slugify(s) {
  return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}
function randomLobbySuffix() { return Math.floor(1000 + Math.random() * 9000); }

/* ---- HOST SIDE ---- */
// net.host = { peer, lobbyId, roster: [{pid,name,clientId,conn,connected}],
//              starting, ready }
function hostState() {
  if (!net.host) net.host = { peer: null, lobbyId: '', status: '', error: '', roster: [], starting: false };
  return net.host;
}
function hostSuggestLobbyId() {
  const base = slugify(net.myName || 'my-game') || 'my-game';
  return `${base}-${randomLobbySuffix()}`;
}
// Keeping the host's typed name in sync everywhere is what fixes "the
// host's name shows as something else (or as the placeholder 'Host')
// in the player list": the lobby's seat 0 was previously only ever
// named once, at the moment the lobby opened (often before the host
// had typed anything), and never touched again. Now every keystroke
// updates the real roster entry too, re-broadcasts it to any guests
// already connected, and live-refreshes just the Players panel --
// deliberately NOT a full renderSetup(), which would rebuild the name
// input itself and kick the cursor out of it mid-type.
function hostSetName(v) {
  if (accountUser) v = accountUser.username;
  net.myName = v;
  const h = hostState();
  if (h.roster[0]) {
    h.roster[0].name = (v || 'Host').slice(0, 24);
    h.roster[0].accountId = accountUser ? accountUser.id : null;
    h.roster[0].avatarUrl = accountUser ? accountUser.avatar_url : null;
    hostBroadcastRoster();
    const panel = $('hostRosterPanel');
    if (panel) panel.innerHTML = hostRosterHTML();
  }
}
function hostOpenLobby(lobbyId) {
  const h = hostState();
  if (accountUser) net.myName = accountUser.username;
  lobbyId = slugify(lobbyId) || hostSuggestLobbyId();
  h.lobbyId = lobbyId; h.error = ''; h.status = 'Opening the lobby...';
  renderSetup();
  try { if (h.peer) h.peer.destroy(); } catch (e) {}
  const peer = new Peer(lobbyId);
  h.peer = peer;
  peer.on('open', () => {
    net.role = 'host'; net.myPid = 0; net.peer = peer;
    if (!h.roster[0]) h.roster[0] = { pid: 0, name: net.myName || 'Host', accountId: accountUser?.id || null, avatarUrl: accountUser?.avatar_url || null, clientId: myClientId(), conn: null, connected: true };
    h.status = 'Waiting for players.'; renderSetup();
  });
  peer.on('connection', conn => hostWireGuestConn(conn));
  peer.on('error', err => {
    if (err && err.type === 'unavailable-id') { h.error = 'That lobby name is taken. Try another.'; h.lobbyId = hostSuggestLobbyId(); }
    else if (err && err.type === 'browser-incompatible') { h.error = 'This browser or app view will not allow the kind of direct connection online play needs. Open this page in Chrome or Safari (not an in-app browser from another app, and not this chat\'s preview), then try again.'; }
    else h.error = 'Could not open the lobby (' + ((err && err.type) || 'network error') + '). Check your connection and try again.';
    h.status = ''; renderSetup();
  });
  peer.on('disconnected', () => { h.status = 'Lost contact with the signaling server. Reconnecting...'; renderSetup(); try { peer.reconnect(); } catch (e) {} });
}
function hostFindSeatByClientId(cid) { return hostState().roster.find(r => r.clientId === cid); }
function hostNextOpenPid() {
  const h = hostState();
  for (let pid = 1; pid < MAX_ONLINE_PLAYERS; pid++) if (!h.roster[pid]) return pid;
  return -1;
}
function hostWireGuestConn(conn) {
  conn.on('data', data => {
    if (!data || typeof data !== 'object') return;
    if (data.t !== 'hello') mpTrace('in', data.t, { name: data.name, pid: data.pid });
    if (data.t === 'hello') hostHandleHello(conn, data);
    else if (data.t === 'act') hostRun(data.name, data.args || [], data.pid, data);
    else if (data.t === 'leave') hostHandleLeave(conn);
  });
  conn.on('close', () => hostHandleDrop(conn));
  conn.on('error', () => hostHandleDrop(conn));
}
function hostHandleHello(conn, data) {
  const h = hostState();
  let seat = hostFindSeatByClientId(data.clientId);
  if (!seat) {
    if (game) { try { conn.send({ t: 'error', message: 'This game has already started without you.' }); } catch (e) {} return; }
    const pid = hostNextOpenPid();
    if (pid < 0) { try { conn.send({ t: 'error', message: 'This lobby already has ' + MAX_ONLINE_PLAYERS + ' players.' }); } catch (e) {} return; }
    seat = { pid, name: (data.name || `Player ${pid + 1}`).slice(0, 24), accountId: data.accountId || null, avatarUrl: data.avatarUrl || null, clientId: data.clientId, conn, connected: true };
    h.roster[pid] = seat;
  } else {
    seat.conn = conn; seat.connected = true; seat.name = (data.name || seat.name).slice(0, 24);
    seat.accountId = data.accountId || seat.accountId || null;
    seat.avatarUrl = data.avatarUrl || seat.avatarUrl || null;
  }
  try { conn.send({ t: 'welcome', pid: seat.pid }); } catch (e) {}
  if (game) {
    // Rejoining a game already in progress: catch them up immediately,
    // no need to replay everything that already happened.
    try { conn.send({ t: 'sync', game, busy, popup, uiIntro: ui.intro, uiNotice: ui.notice, connFlags: hostConnFlags() }); } catch (e) {}
  }
  hostBroadcastRoster();
  render();
}
function hostHandleDrop(conn) {
  const h = hostState();
  const seat = h.roster.find(r => r.conn === conn);
  if (!seat) return;
  seat.connected = false; seat.conn = null;
  hostBroadcastRoster();
  render();
}
function hostHandleLeave(conn) {
  const h = hostState();
  const seat = h.roster.find(r => r.conn === conn);
  if (!seat) return;
  seat.connected = false; seat.conn = null; seat.left = true;
  hostBroadcastRoster();
  render();
}
function hostConnFlags() {
  const flags = {};
  hostState().roster.forEach(r => { if (r) flags[r.pid] = !!r.connected; });
  return flags;
}
function hostBroadcastRoster() {
  const h = hostState();
  const seats = h.roster.filter(Boolean).map(r => ({ pid: r.pid, name: r.name, accountId: r.accountId || null, avatarUrl: r.avatarUrl || null, connected: r.connected }));
  hostSend({ t: 'roster', seats });
  if (game) hostSend({ t: 'conn', connFlags: hostConnFlags() });
}
// Sends one message to every currently-connected guest. Every message the
// host ever sends gets a host-assigned sequence number, so any client can
// tell the exact order the host meant them to be applied in (useful for
// spotting reordering/drops in the debug log; the data channel itself is
// already ordered+reliable, so this is a diagnostic, not a second
// ordering mechanism).
function hostSend(obj) {
  const msg = Object.assign({ seq: ++hostMsgSeq }, obj);
  mpTrace('out', msg.t, { name: msg.name, pid: msg.pid, seq: msg.seq });
  hostState().roster.forEach(r => { if (r && r.conn && r.conn.open) { try { r.conn.send(msg); } catch (e) {} } });
}
function hostRosterReady() { return hostState().roster.filter(r => r && r.connected).length >= 2; }
async function hostStartOnline() {
  const h = hostState();
  if (h.starting || !hostRosterReady()) return;
  h.starting = true; renderSetup();
  const seats = h.roster.filter(Boolean);
  const names = seats.map(r => r.name);
  const colors = seats.map((r, i) => PLAYER_COLORS[i]);
  const accountIds = seats.map(r => r.accountId || null);
  await hostRun('beginGame', [names, colors, selectedHostBoard ? selectedHostBoard.property_names : {}, accountIds], net.myPid);
}
// Lets the host force an unresponsive (disconnected) player's turn to
// end, so the game is not stuck waiting for someone who is gone.
function hostSkipDisconnected() {
  if (net.role !== 'host' || !game) return;
  const flags = hostConnFlags();
  if (flags[cur().id] === false) hostRun('endTurnClick', [], cur().id);
}

/* ---- GUEST SIDE ---- */
// net.join = { peer, conn, hostId, name, status, error, reconnecting }
function joinState() { if (!net.join) net.join = { peer: null, conn: null, hostId: '', name: '', status: '', error: '', reconnecting: false }; return net.join; }
function joinStart(hostId, name) {
  const j = joinState();
  if (!accountUser) { j.error = 'Sign in to join an online game.'; renderSetup(); return; }
  j.hostId = slugify(hostId); j.name = (name || '').trim().slice(0, 14) || 'Player';
  j.name = accountUser.username;
  net.myName = j.name;
  if (!j.hostId) { j.error = 'Enter the host\'s lobby name.'; renderSetup(); return; }
  j.error = ''; j.status = 'Connecting...'; renderSetup();
  try { if (j.peer) j.peer.destroy(); } catch (e) {}
  const peer = new Peer();
  j.peer = peer;
  peer.on('open', () => { net.peer = peer; joinConnect(); });
  peer.on('error', err => {
    if (err && err.type === 'peer-unavailable') j.error = 'No game found with that lobby name. Check the spelling with the host.';
    else if (err && err.type === 'browser-incompatible') j.error = 'This browser or app view will not allow the kind of direct connection online play needs. Open this page in Chrome or Safari (not an in-app browser from another app, and not this chat\'s preview), then try again.';
    else j.error = 'Could not connect (' + ((err && err.type) || 'network error') + '). Check your connection and try again.';
    j.status = ''; renderSetup();
  });
  peer.on('disconnected', () => { if (j.peer) { try { j.peer.reconnect(); } catch (e) {} } });
}
function joinConnect() {
  const j = joinState();
  const conn = j.peer.connect(j.hostId, { reliable: true });
  j.conn = conn;
  conn.on('open', () => {
    j.status = j.reconnecting ? 'Reconnected. Catching up...' : 'Connected. Joining...';
    j.error = ''; j.reconnecting = false;
    net.role = 'guest';
    try { conn.send({ t: 'hello', name: j.name, accountId: accountUser?.id, avatarUrl: accountUser?.avatar_url, clientId: myClientId() }); } catch (e) {}
    renderSetup();
  });
  conn.on('data', data => joinHandleData(data));
  conn.on('close', () => joinHandleDrop());
  conn.on('error', () => joinHandleDrop());
}
function joinHandleDrop() {
  const j = joinState();
  if (!net.role) return;   // never actually connected, nothing to recover
  if (game && !game.over) {
    j.reconnecting = true; j.status = 'Disconnected. Reconnecting...';
    render();
    setTimeout(() => { if (net.role === 'guest' && joinState().reconnecting) joinConnect(); }, 2500);
  } else {
    j.status = 'Disconnected from host.';
    renderSetup();
  }
}
function joinHandleData(data) {
  if (!data || typeof data !== 'object') return;
  const j = joinState();
  mpTrace('in', data.t, { name: data.name, pid: data.pid, seq: data.seq });
  if (data.t === 'welcome') { net.myPid = data.pid; }
  else if (data.t === 'error') { j.error = data.message || 'The host declined the connection.'; if (!game) renderSetup(); }
  else if (data.t === 'roster') { j.roster = data.seats; if (!game) renderSetup(); }
  else if (data.t === 'conn') { connStatus = data.connFlags || {}; if (game) render(); }
  else if (data.t === 'sync') applySyncSnapshot(data);
  else if (data.t === 'rng') guestReceiveRng(data.v);          // must be handled instantly, not queued (see rnd())
  else if (data.t === 'run' && data.name === 'closeCard') {
    // MUST be handled instantly, not queued through enqueueReplay below.
    // This message's whole purpose is to unblock a showCard() promise
    // that some earlier, still-in-progress queued 'run' is awaiting.
    // Queuing it behind that same still-running message would deadlock
    // the replay pump forever (see showCard/closeCard for the full
    // explanation) -- this was the actual cause of clients freezing on
    // Chance/Community Chest cards.
    try { closeCard(...(data.args || [])); } catch (e) {}
  }
  else if (data.t === 'run' || data.t === 'final') enqueueReplay(data);
}
function joinLeave() {
  const j = net.join;
  if (j && j.conn && j.conn.open) { try { j.conn.send({ t: 'leave' }); } catch (e) {} }
  netTeardown();
  renderSetup();
}

/* ---- Shared: state adoption, replay queue, and the action dispatcher ---- */
let connStatus = {};   // pid -> connected, kept up to date from the host
// Applied when a guest (re)joins a game already under way: an instant,
// unanimated snapshot to get them caught up, after which normal replay
// keeps them live.
function applySyncSnapshot(msg) {
  connStatus = msg.connFlags || {};
  game = adoptPeerSnapshot(msg.game); busy = msg.busy; popup = msg.popup; ui.intro = msg.uiIntro; ui.notice = msg.uiNotice || '';
  attachGame();
  mpTrace('apply', 'sync', { rev: game.rev || 0 });
}
function adoptPeerSnapshot(snapshot) {
  const restored = MonopolyGameEngine.deserializeState(snapshot);
  const sync = window.authoritativeGame;
  return isBackendAuthoritativeGame() && sync && sync.preserveAuthoritativeTurnState
    ? sync.preserveAuthoritativeTurnState(restored)
    : restored;
}
// 'run' and 'final' messages (see hostRun) arrive on the same ordered
// data channel, in the order the host sent them, so queuing them
// together and handling them strictly one at a time is what guarantees
// a 'final' snapshot is never applied before this guest's own replay of
// the matching 'run' has actually finished running -- and, just as
// important, that a burst of late/delayed messages after a network
// hiccup plays back in the right order instead of racing each other,
// which is what used to cause skipped or doubled-up animations and
// guests occasionally freezing on a stale screen.
let replayQueue = [], replaying = false;
function enqueueReplay(msg) { replayQueue.push(msg); pumpReplay(); }
async function pumpReplay() {
  if (replaying) return;
  replaying = true;
  while (replayQueue.length) { const msg = replayQueue.shift(); await guestReplay(msg); }
  replaying = false;
}
async function guestReplay(msg) {
  if (msg.t === 'run') {
    if (isBackendAuthoritativeGame() && msg.name === 'rollDice') {
      mpTrace('apply', 'run-ignored', { name: msg.name, seq: msg.seq, reason: 'backend-authoritative roll' });
      return;
    }
    // Actually run the action for real, right now -- this is what lets
    // a guest's dice, camera and piece start moving at (almost) the

// near the top of the script and hostRun/guestReplay in SECTION 15.

  if (!applyGameAction({ type: 'SET_TURN_ORDER', order })) throw new Error('The starting turn order is invalid.');

    await presentAuthoritativeTurnEvents(snapshot.events, roll.playerId);
    if (!wasBusy) {
      busy = false;
      finishMovementCamera(T(600));
      render();
    }
  });
}

async function presentAuthoritativeTurnEvents(events, rollingPlayerId) {
  const moves = events.filter(event => event.type === 'PLAYER_MOVED');
  if (moves.length) {
    moveCameraFocus(tokenPos[rollingPlayerId] ?? moves[0].from, T(400), 'follow');
    await sleep(T(200));
  }
  const stepDuration = stepTime(moves.length || 1);
  const landingTypes = new Set([
    'PROPERTY_AVAILABLE', 'NO_RENT_MORTGAGED', 'RENT_DUE', 'LANDING_OWN_PROPERTY',
    'TAX_DUE', 'LANDING_GO_TO_JAIL', 'LANDING_NO_EFFECT', 'CARD_DRAW_REQUESTED',
  ]);
  let landingLogged = false;

  for (const event of events) {
    if (event.type === 'PLAYER_MOVED') {
      const player = game.players[event.playerId];
      if (!player) continue;
      if (tokenPos[player.id] !== event.from) tokenPos[player.id] = event.from;
      $('tokens').style.setProperty('--step', stepDuration + 'ms');
      tokenPos[player.id] = event.to;
      updateTokens();
      hop(player.id, stepDuration);
      sfx.step();
      moveCameraFocus(event.to, stepDuration, 'follow');
      await sleep(stepDuration);
    } else if (event.type === 'GO_SALARY_COLLECTED') {
      const player = game.players[event.playerId];
      if (player) log(`${player.name} passes GO and collects ${fmt(event.amount)}.`);
      render();
    } else if (landingTypes.has(event.type)) {
      const player = game.players[event.playerId];
      const position = event.position == null ? player && player.pos : event.position;
      if (!landingLogged && player && position != null) {
        log(`${player.name} lands on ${spaceLabel(position)}.`);
        landingLogged = true;
        render();
        await sleep(T(300));
      }
      if (event.type === 'PROPERTY_AVAILABLE') log(`${spaceLabel(event.position)} is for sale at ${fmt(event.amount)}.`);
      else if (event.type === 'NO_RENT_MORTGAGED') log(`${spaceLabel(event.position)} is mortgaged. No rent.`);
      else if (event.type === 'RENT_DUE') {
        const owner = game.players[event.ownerId];
        if (player && owner) log(`${player.name} owes ${owner.name} ${fmt(event.amount)} rent.`);
      } else if (event.type === 'LANDING_OWN_PROPERTY' && player) log(`${player.name} owns this one already.`);
      else if (event.type === 'TAX_DUE' && player) log(`${player.name} pays ${fmt(event.amount)} in tax.`);
      else if (event.type === 'LANDING_GO_TO_JAIL' && player) log(`${player.name} goes to jail.`);
    } else if (event.type === 'THREE_DOUBLES_JAIL') {
      const player = game.players[event.playerId];
      if (player) log(`Three doubles in a row. ${player.name} goes to jail.`);
      await animateJail(event.playerId);
    } else if (event.type === 'PLAYER_JAILED') {
      await animateJail(event.playerId);
    } else if (event.type === 'JAIL_RELEASED') {
      const player = game.players[event.playerId];
      if (player) log(`${player.name} rolled doubles and leaves jail.`);
    } else if (event.type === 'JAIL_ROLL_FAILED') {
      const player = game.players[event.playerId];
      if (player) log(`No doubles. ${player.name} stays in jail.`);
    } else if (event.type === 'JAIL_FINE_DUE') {
      const player = game.players[event.playerId];
      if (player) log(`${player.name} pays ${fmt(event.amount)} after 3 tries.`);
    } else if (event.type === 'DOUBLES_AGAIN') {
      log('Doubles. Roll again.');
    } else if (event.type === 'TURN_CHANGED') {
      const nextPlayer = game.players[event.playerId];
      if (nextPlayer) log(`${nextPlayer.name}'s turn.`);
    }
  }

  presentPaymentEvents(events);
  render();
}

async function accountRequest(path, options = {}) {
  const response = await fetch(path, {
    credentials: 'same-origin',
    ...options,
    headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(options.headers || {}) },
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || `Account request failed (${response.status}).`);
  return result;
}

// Loading a save only creates the WAITING resume lobby server-side and
// returns bare account IDs (no usernames/avatars/returned status) --
// backendRefreshLobby immediately pulls the real lobby view (which does
// have all of that, including per-seat returned_at) and renders it, the
// same way joining an ordinary lobby does.
async function backendResumeFromSave(saveId) {
  if (!saveId) return;
  try {
    const result = await backendGameRequest('/api/game/load', {
      method: 'POST',
      body: JSON.stringify({ saveId }),
    });
    setup.screen = 'serverLobby';
    startBackendLobbyPolling(result.gameId);
    await backendRefreshLobby(result.gameId);
    await refreshBackendMyGames();
  } catch (error) {
    setAccountStatus(error.message);
  }
}

// Distinct from backendStartGame(): a resume lobby's authoritative state
// comes only from POST /api/game/resume, which restores the exact saved
// snapshot server-side. The backend independently refuses to let a resume
// lobby go through the ordinary start endpoint (USE_RESUME_ENDPOINT), so
// this is the only path that can ever bring one back to ACTIVE.
async function backendResumeGame(gameId) {
  if (!gameId) return;
  try {
    const result = await backendGameRequest('/api/game/resume', {
      method: 'POST',
      body: JSON.stringify({ gameId }),
    });
    if (window.authoritativeGame) {
      // Resuming an existing match must not replay the fresh-match order reveal.
      await activateBackendGame({
        gameId: result.gameId,
        version: result.version || 1,
        status: result.status || 'ACTIVE',
        state: result.state || null,
        events: Array.isArray(result.events) ? result.events : [],
      });
    }
    await refreshBackendMyGames();
  } catch (error) {
    setAccountStatus(error.message);
  }
}


function stopBackendLobbyPolling() {
  if (backendLobbyPollId) clearInterval(backendLobbyPollId);
  backendLobbyPollId = null;
  backendLobbyPollInFlight = false;
}

function startBackendLobbyPolling(gameId) {
  if (!gameId) return;
  if (backendLobbyPollId && backendLobby && backendLobby.gameId === gameId) return;
  stopBackendLobbyPolling();
  // Check immediately, then keep a short fallback poll. This removes the
  // guaranteed one-second wait after another player changes lobby state.
  backendRefreshLobby(gameId, { fromPoll: true });
  backendLobbyPollId = setInterval(() => {
    if (document.visibilityState === 'hidden' || backendLobbyPollInFlight || !backendLobby || backendLobby.gameId !== gameId) return;
    backendRefreshLobby(gameId, { fromPoll: true });
  }, 250);
}

async function activateBackendGame(payload) {
  stopBackendLobbyPolling();
  if (window.authoritativeGame) {
    await window.authoritativeGame.setAuthoritativeState(payload);
    window.authoritativeGame.startPolling(payload.gameId);
  }
}

async function backendGameRequest(path, options = {}) {
  const response = await fetch(path, {
    credentials: 'same-origin',
    ...options,
    headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(options.headers || {}) },
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error?.message || result.error || `Server lobby request failed (${response.status}).`);
  return result;
}

async function backendRejoinPausedGame(gameId) {

async function backendRenameGame(gameId, currentName) {
  if (!gameId) return;
  const nextName = window.prompt('Server game name:', currentName || 'Server game');
  if (nextName == null) return;
  const name = nextName.trim();
  if (!name || name.length > 80) {
    backendSocialError = 'Enter a server game name between 1 and 80 characters.';
    renderSetup();
    return;
  }
  try {
    await backendGameRequest('/api/game/rename', {
      method: 'PATCH',
      body: JSON.stringify({ gameId, name }),
    });
    if (backendLobby?.gameId === gameId && backendLobby.game) backendLobby.game.name = name;
    await refreshBackendMyGames();
    backendSocialError = 'Server game renamed.';
  } catch (error) {
    backendSocialError = error.message;
  }
  renderSetup();
}

async function backendDeleteGame(gameId) {
  if (!gameId || !window.confirm('Delete this server game and its stored multiplayer records? This cannot be undone.')) return;
  try {
    await backendGameRequest('/api/game/delete', {
      method: 'POST',
      body: JSON.stringify({ gameId }),
    });
    if (backendLobby?.gameId === gameId) backendLobby = null;
    await refreshBackendMyGames();
    renderSetup();
  } catch (error) {
    backendSocialError = error.message;
    renderSetup();
  }
}

async function backendInviteFriend(gameId, friendId) {

async function backendRespondToInvitation(invitationId, action) {
  try {
    const result = await backendGameRequest(`/api/game/invitations/${encodeURIComponent(invitationId)}`, {
      method: 'PATCH',
      body: JSON.stringify({ action }),
    });
    if (action === 'accept') {
      backendLobby = {
        gameId: result.gameId,
        game: result.game || null,
        players: Array.isArray(result.players) ? result.players : [],
        canStart: !!result.canStart,
      };
      setup.screen = 'serverLobby';
      startBackendLobbyPolling(result.gameId);
    }
    backendSocialError = action === 'accept' ? '' : 'Invitation declined.';
    await refreshBackendMyGames();
  } catch (error) {
    backendSocialError = error.message;
  }
  renderSetup();
}

async function backendRefreshLobby(gameId, options = {}) {
  if (!gameId || backendLobbyPollInFlight) return;
  backendLobbyPollInFlight = true;
  try {
    const result = await backendGameRequest(`/api/game/lobby?gameId=${encodeURIComponent(gameId)}`);
    backendLobby = {
      gameId: result.gameId,
      game: result.game || null,
      players: Array.isArray(result.players) ? result.players : [],
      canStart: !!result.canStart,
      canResume: !!result.canResume,
    };
    const status = result.status || result.game?.status;
    if (status === 'ACTIVE') {
      authoritativeShowStartIntroGameId = result.gameId;
      stopBackendLobbyPolling();
      if (window.authoritativeGame.gameId && window.authoritativeGame.gameId !== result.gameId) {
        await window.authoritativeGame.clearAuthoritativeState();
      }
      const state = await window.authoritativeGame.fetchLatest(result.gameId);
      if (state) window.authoritativeGame.startPolling(result.gameId);
      return;
    }
    renderSetup();
  } catch (error) {
    if (!options.fromPoll) setAccountStatus(error.message);
  } finally {
    backendLobbyPollInFlight = false;
  }
}

async function backendLeaveGame(gameId) {
  if (!gameId) return;
  try {
    await backendGameRequest('/api/game/leave', {
      method: 'POST',
      body: JSON.stringify({ gameId }),
    });
    stopBackendLobbyPolling();
    if (window.authoritativeGame && window.authoritativeGame.gameId === gameId) {
      await window.authoritativeGame.clearAuthoritativeState();
      authoritativeAppliedGameId = null;
      game = null;
      stopGameTick();
    }
    if (backendLobby && backendLobby.gameId === gameId) backendLobby = null;
    await refreshBackendMyGames();
    renderSetup();
  } catch (error) {
    setAccountStatus(error.message);
  }
}

async function backendStartGame(gameId) {
  if (!gameId) return;
  try {
    const result = await backendGameRequest('/api/game/start', {
      method: 'POST',
      body: JSON.stringify({ gameId }),
    });
    backendLobby = {
      gameId: result.gameId,
      game: result.game || null,
      players: Array.isArray(result.players) ? result.players : [],
      canStart: false,
    };
    if (window.authoritativeGame) {
      authoritativeShowStartIntroGameId = result.gameId;
      await activateBackendGame({
        gameId: result.gameId,
        version: result.version || 1,
        status: result.status || 'ACTIVE',
        state: result.state || null,
        events: Array.isArray(result.events) ? result.events : [],
      });
    }
    await refreshBackendMyGames();
  } catch (error) {
    setAccountStatus(error.message);
  }
}

function backendLobbyPlayersHTML(players = [], title = 'Players', options = {}) {
  if (!players.length) return `<div class="panel acc-orange"><h2>🧑‍🤝‍🧑 ${title}</h2><p class="muted">No one has joined this server lobby yet.</p></div>`;
  const isResume = !!options.isResume || !!options.isPaused;
  const rows = players.map(p => {
    const name = p.username || p.name || 'Player';
    const seat = Number(p.seatIndex ?? p.seat_index ?? 0) + 1;
    const avatar = p.avatarUrl || p.avatar_url;
    const returned = p.returnedAt || p.returned_at;
    const statusTag = isResume
      ? `<span class="tag ${returned ? 'ok' : 'wait'}">${returned ? 'Ready' : 'Missing'}</span>`
      : `<span class="tag">Seat ${seat}</span>`;
    const playerId = p.accountId || p.account_id;
    const isSelf = playerId && accountUser?.id === playerId;
    const isFriend = backendFriends.some(friend => friend.id === playerId);
    const friendAction = !playerId || isSelf ? '' : isFriend
      ? '<span class="tag">Friend</span>'
      : `<button class="btn alt" onclick="sendLobbyFriendRequest('${esc(name)}')">Add friend</button>`;
    return `<div class="social-row">${socialAvatar({ username: name, avatar_url: avatar })}<span class="social-name">${esc(name)}</span>${statusTag}${friendAction}</div>`;
  }).join('');
  return `<div class="panel acc-orange"><h2>🧑‍🤝‍🧑 ${title}</h2>${rows}</div>`;
}

function incomingGameInvitationsHTML() {

  if (!incoming.length) return '';
  return `<div class="panel acc-orange"><h2>Game invitations</h2>

}

  const isHost = !!accountUser && lobby?.game?.hostAccountId === accountUser.id;

  const lobbyPanel = lobby && lobby.gameId ? `

      ${status === 'WAITING' && isHost ? `<div class="panel acc-yellow"><h2>Invite friends</h2>

          const existing = backendGameInvitations.find(invitation => invitation.direction === 'outgoing' &&

            ${existing ? '<span class="tag">Invited</span>' : `<button class="btn alt" onclick="backendInviteFriend('${esc(lobby.gameId)}','${esc(friend.id)}')">Invite</button>`}</div>`;
        }).join('') || '<p class="muted">All friends are already in this lobby.</p>'}
      </div>` : ''}

  const gamesPanel = backendMyGames.length ? `

  const savesPanel = backendSaves.length ? `

    </div>` : '';

  $('app').innerHTML = `<div class="setup">

  const games = backendMyGames.map(game => {

      ? `<button class="btn" onclick="backendRejoinPausedGame('${esc(gameId)}')">Rejoin</button>`
      : `<button class="btn alt" onclick="backendOpenGame('${esc(gameId)}')">${status === 'ACTIVE' ? 'Continue' : 'Open'}</button>`;
    return `<div class="social-row"><span class="social-name">${esc(game.name || 'Server game')}</span>
      <span class="tag">${status}</span>${action}
      ${game.isHost ? `<button class="btn alt" onclick="backendRenameGame('${esc(gameId)}','${esc(game.name || 'Server game')}')">Rename</button>` : ''}</div>`;
  }).join('');

  $('app').innerHTML = `<div class="setup">
    <div class="setup-logo-wrap"><img src="${LOGO_SRC}" class="setup-logo" alt="MONOPOLY"></div>
    <p class="sub">Game invitations</p>
    ${!accountUser ? accountPanelHTML() : ''}
    ${incomingGameInvitationsHTML() || '<div class="panel acc-orange"><p class="muted">No pending invitations.</p></div>'}
    ${games ? `<div class="panel acc-yellow"><h2>My server games</h2>${games}</div>` : ''}
    <details class="panel acc-blue">
      <summary>Debug: join by game ID</summary>
      <label class="muted" for="serverGameId">Server game ID</label>
      <input type="text" id="serverGameId" value="${esc(backendJoinGameId)}" autocomplete="off">
      <button class="btn alt" ${backendLobbyController.inFlight || !accountUser ? 'disabled' : ''}
        onclick="backendJoinGame(document.getElementById('serverGameId').value)">${backendLobbyController.inFlight ? 'Joining…' : 'Join by ID'}</button>
    </details>
    ${backendSocialError || backendLobbyController.error ? `<p class="error" role="alert">${esc(backendSocialError || backendLobbyController.error)}</p>` : ''}
    <div class="panel acc-green"><h2>Friends</h2>
      <button class="btn alt" onclick="openFriendsScreen()">Manage friends</button>
    </div>
    <div class="panel acc-red"><button class="btn alt" onclick="setup.screen=''; renderSetup()">Back</button></div>
  </div>`;
}

function setAccountStatus(message) {
  accountMessage = message;
  const status = $('accountStatus');
  if (status) status.textContent = message;
}

function applyAccountSettings(settings = {}) {
  accountSettings = {
    ...DEFAULT_ACCOUNT_SETTINGS,
    ...settings,
    interfacePreferences: { ...DEFAULT_ACCOUNT_SETTINGS.interfacePreferences, ...(settings.interfacePreferences || {}) },
    cameraPreferences: { ...DEFAULT_ACCOUNT_SETTINGS.cameraPreferences, ...(settings.cameraPreferences || {}) },
    gamePreferences: { ...DEFAULT_ACCOUNT_SETTINGS.gamePreferences, ...(settings.gamePreferences || {}) },
    other: settings.other || {},
  };
  if ([2, 3, 4, 5, 6, 7, 8].includes(accountSettings.gamePreferences.playerCount)) {
    setup.count = accountSettings.gamePreferences.playerCount;
  }
  musicVolume = Math.max(0, Math.min(100, Number(accountSettings.musicVolume))) / 100;
  soundEffectsVolume = Math.max(0, Math.min(100, Number(accountSettings.soundEffectsVolume))) / 100;
  soundOn = accountSettings.interfacePreferences.soundEnabled !== false;
  cameraOn = accountSettings.cameraPreferences.follow !== false;
  tiltOn = accountSettings.cameraPreferences.tilt !== false;
  if (bgMusic) bgMusic.volume = musicVolume * MAX_MUSIC_VOLUME;
  try { localStorage.removeItem('monopolyMusicVolume'); } catch (e) {}
  applySoundEffectsVolume();
  updateTopButtons();
  const scene = $('scene');
  if (scene) scene.classList.toggle('tilt', tiltOn), scene.classList.toggle('flat', !tiltOn);
  if (!cameraOn) cameraReset(0);
  const musicSlider = $('volSlider');
  if (musicSlider) musicSlider.value = Math.round(musicVolume * 100);
}

function queueAccountSettings(changes) {
  if (!accountUser) return;
  const merged = { ...changes };
  for (const key of ['interfacePreferences', 'cameraPreferences', 'gamePreferences', 'other']) {
    if (changes[key]) merged[key] = { ...(accountSettings[key] || {}), ...changes[key] };
  }
  accountSettings = { ...accountSettings, ...merged };
  pendingAccountSettings = { ...pendingAccountSettings, ...merged };
  for (const key of ['interfacePreferences', 'cameraPreferences', 'gamePreferences', 'other']) {
    if (pendingAccountSettings[key]) pendingAccountSettings[key] = { ...(accountSettings[key] || {}), ...pendingAccountSettings[key] };
  }
  setAccountStatus('Saving account settings...');
  clearTimeout(accountSaveTimer);
  accountSaveTimer = setTimeout(saveAccountSettings, 500);
}

async function saveAccountSettings() {
  if (!accountUser || accountSaveInFlight || !Object.keys(pendingAccountSettings).length) return;
  const changes = pendingAccountSettings;
  pendingAccountSettings = {};
  accountSaveInFlight = true;
  let saved = false;
  try {
    const result = await accountRequest('/api/settings', {
      method: 'PATCH', body: JSON.stringify({ settings: changes }),
    });
    accountSettings = { ...accountSettings, ...result.settings };
    saved = true;
    setAccountStatus('Settings synced to your account.');
  } catch (error) {
    pendingAccountSettings = { ...changes, ...pendingAccountSettings };
    setAccountStatus(`Not synced: ${error.message}`);
  } finally {
    accountSaveInFlight = false;
    if (saved && Object.keys(pendingAccountSettings).length && accountUser) {
      clearTimeout(accountSaveTimer);
      accountSaveTimer = setTimeout(saveAccountSettings, 500);
    }
  }
}

function setAccountSound(enabled) {
  soundOn = enabled;
  updateTopButtons();
  if (soundOn) startBgMusic(); else if (bgMusic) bgMusic.pause();
  queueAccountSettings({ interfacePreferences: { soundEnabled: soundOn } });
}

function setAccountCamera(key, enabled) {
  if (key === 'follow') cameraOn = enabled;
  if (key === 'tilt') tiltOn = enabled;
  const scene = $('scene');
  if (scene) scene.classList.toggle('tilt', tiltOn), scene.classList.toggle('flat', !tiltOn);
  if (!cameraOn) cameraReset(0);
  updateTopButtons();
  queueAccountSettings({ cameraPreferences: { follow: cameraOn, tilt: tiltOn } });
}

function accountPanelHTML() {
  if (!accountUser) return `<div class="panel acc-blue account-panel">
    <h2>👤 Account</h2>
    <p class="muted">Sign in to sync your profile and game preferences across devices.</p>
    <div class="seg">
      <button class="btn ${accountMode === 'signin' ? '' : 'alt'}" type="button" onclick="setAccountMode('signin')">Sign in</button>
      <button class="btn ${accountMode === 'signup' ? '' : 'alt'}" type="button" onclick="setAccountMode('signup')">Sign up</button>
    </div>
    <form class="account-fields" onsubmit="submitAccountAuth(event)">
      <label class="muted" for="accountUsername">Username</label>
      <input id="accountUsername" name="username" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
      <label class="muted" for="accountPassword">Password</label>
      <input id="accountPassword" name="password" type="password" minlength="10" maxlength="72" autocomplete="${accountMode === 'signup' ? 'new-password' : 'current-password'}" required>
      <button class="btn" type="submit" ${accountBusy ? 'disabled' : ''}>${accountBusy ? 'Working...' : accountMode === 'signup' ? 'Create account' : 'Sign in'}</button>
    </form>
    <p class="account-status" id="accountStatus" role="status">${esc(accountMessage)}</p>
  </div>`;

  const settings = {
    ...DEFAULT_ACCOUNT_SETTINGS,
    ...accountSettings,
    interfacePreferences: { ...DEFAULT_ACCOUNT_SETTINGS.interfacePreferences, ...(accountSettings.interfacePreferences || {}) },
    cameraPreferences: { ...DEFAULT_ACCOUNT_SETTINGS.cameraPreferences, ...(accountSettings.cameraPreferences || {}) },
    gamePreferences: { ...DEFAULT_ACCOUNT_SETTINGS.gamePreferences, ...(accountSettings.gamePreferences || {}) },
  };
  const avatar = accountUser.avatar_url
    ? `<img class="account-avatar" src="${esc(accountUser.avatar_url)}" alt="${esc(accountUser.username)} profile picture">`
    : `<span class="account-avatar" aria-hidden="true" style="display:grid;place-items:center;font-weight:800">${esc(accountUser.username.slice(0, 1).toUpperCase())}</span>`;
  return `<div class="panel acc-green account-panel">
    <h2>👤 Account</h2>
    <div class="account-row">${avatar}<strong>${esc(accountUser.username)}</strong>
      <button class="btn alt" type="button" onclick="signOutAccount()" ${accountBusy ? 'disabled' : ''}>Sign out</button>
    </div>
    <form class="account-fields" onsubmit="changeAccountUsername(event)">
      <label class="muted" for="newAccountUsername">Change username</label>
      <div class="account-row"><input id="newAccountUsername" name="username" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" value="${esc(accountUser.username)}" required>
        <button class="btn alt" type="submit" ${accountBusy ? 'disabled' : ''}>Update</button></div>
    </form>
    <div class="account-actions">
      <label class="btn alt" for="accountAvatarFile">Choose picture</label>
      <input id="accountAvatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="uploadAccountAvatar(this.files[0])">
      ${accountUser.avatar_url ? '<button class="btn alt" type="button" onclick="removeAccountAvatar()">Remove picture</button>' : ''}
    </div>
    <form class="account-fields" onsubmit="changeAccountPassword(event)">
      <label class="muted" for="currentAccountPassword">Change password</label>
      <input id="currentAccountPassword" name="currentPassword" type="password" autocomplete="current-password" placeholder="Current password" required>
      <input name="newPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password" placeholder="New password (10-72 bytes)" required>
      <button class="btn alt" type="submit" ${accountBusy ? 'disabled' : ''}>Update password</button>
    </form>
    <div class="account-preferences">
      <label for="accountMusicVolume">Music volume<input id="accountMusicVolume" type="range" min="0" max="100" value="${Math.round(Number(settings.musicVolume))}" oninput="setMusicVolume(this.value)"></label>
      <label for="accountSfxVolume">Effects volume<input id="accountSfxVolume" type="range" min="0" max="100" value="${Math.round(Number(settings.soundEffectsVolume))}" oninput="setSoundEffectsVolume(this.value)"></label>
      <label for="accountSoundEnabled">Game sounds<input id="accountSoundEnabled" type="checkbox" ${settings.interfacePreferences.soundEnabled ? 'checked' : ''} onchange="setAccountSound(this.checked)"></label>
      <label for="accountCameraFollow">Camera follow<input id="accountCameraFollow" type="checkbox" ${settings.cameraPreferences.follow ? 'checked' : ''} onchange="setAccountCamera('follow', this.checked)"></label>
      <label for="accountCameraTilt">3D board view<input id="accountCameraTilt" type="checkbox" ${settings.cameraPreferences.tilt ? 'checked' : ''} onchange="setAccountCamera('tilt', this.checked)"></label>
    </div>
    <p class="account-status" id="accountStatus" role="status">${esc(accountMessage)}</p>
  </div>`;
}

function setAccountMode(mode) {
  accountMode = mode;
  renderSetup();
}

async function restoreAccountSession() {
  try {
    const result = await accountRequest('/api/auth/session');
    accountUser = result.user;
    accountMessage = accountUser ? 'Account session restored.' : 'Sign in to sync your settings.';
if (accountUser) {
      applyAccountSettings(accountUser.settings || {});
      startAccountPresence();
      await refreshBackendMyGames();
    } else stopAccountPresence();
  } catch (error) {
    accountUser = null;
    accountMessage = `Account service unavailable: ${error.message}`;
  }
  renderSetup();
}

async function submitAccountAuth(event) {
  event.preventDefault();
  if (accountBusy) return;
  accountBusy = true; renderSetup();
  try {
    const values = Object.fromEntries(new FormData(event.currentTarget));
    const result = await accountRequest(`/api/auth/${accountMode === 'signup' ? 'signup' : 'signin'}`, {
      method: 'POST', body: JSON.stringify(values),
    });
    accountUser = result.user;
    applyAccountSettings(accountUser.settings || {});
    startAccountPresence();
    accountMessage = 'Signed in. Settings are stored with your account.';
  } catch (error) {
    accountMessage = error.message;
  } finally {
    accountBusy = false;
    renderSetup();
  }
}

async function signOutAccount() {
  if (accountBusy) return;
  accountBusy = true;
  try {
    await accountRequest('/api/auth/signout', { method: 'POST', body: '{}' });
    accountUser = null;
    backendLobby = null;
    backendMyGames = [];
    stopAccountPresence();
    accountSettings = {};
    pendingAccountSettings = {};
    accountMessage = 'Signed out.';
  } catch (error) {
    accountMessage = error.message;
  } finally {
    accountBusy = false;
    renderSetup();
  }
}

async function changeAccountUsername(event) {
  event.preventDefault();
  const username = new FormData(event.currentTarget).get('username');
  try {
    const result = await accountRequest('/api/profile', { method: 'PATCH', body: JSON.stringify({ username }) });
    accountUser = result.user;
    accountMessage = 'Username updated and synced.';
    renderSetup();
  } catch (error) { setAccountStatus(error.message); }
}

async function changeAccountPassword(event) {
  event.preventDefault();
  const values = Object.fromEntries(new FormData(event.currentTarget));
  try {
    await accountRequest('/api/profile/password', { method: 'POST', body: JSON.stringify(values) });
    event.currentTarget.reset();
    setAccountStatus('Password updated.');
  } catch (error) { setAccountStatus(error.message); }
}

async function uploadAccountAvatar(file) {
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { setAccountStatus('Profile pictures must be 2 MB or smaller.'); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const result = await accountRequest('/api/profile/avatar', {
        method: 'POST', body: JSON.stringify({ image: reader.result }),
      });
      accountUser = { ...accountUser, avatar_url: result.avatar_url };
      accountMessage = 'Profile picture uploaded and synced.';
      renderSetup();
    } catch (error) { setAccountStatus(error.message); }
  };
  reader.onerror = () => setAccountStatus('Could not read that image file.');
  reader.readAsDataURL(file);
}

async function removeAccountAvatar() {
  try {
    await accountRequest('/api/profile/avatar', { method: 'DELETE' });
    accountUser = { ...accountUser, avatar_url: null };
    accountMessage = 'Profile picture removed.';
    renderSetup();
  } catch (error) { setAccountStatus(error.message); }
}

function setSoundEffectsVolume(pct) {
  soundEffectsVolume = Math.max(0, Math.min(100, +pct)) / 100;
  applySoundEffectsVolume();
  queueAccountSettings({ soundEffectsVolume: Math.round(soundEffectsVolume * 100) });
}

function howToPlayHTML() {
  return `<div class="panel">
    <details>
      <summary>How to play</summary>
      <ol>
        <li>Press <b>Roll</b>. The dice tumble onto the board, your piece hops around it and the camera follows.</li>
        <li>Land on an unowned property and its deed card opens. <b>Buy</b> it, or send it to <b>auction</b> so everyone can bid.</li>
        <li>Land on someone else's property and you pay rent automatically.</li>
        <li>Own every property of one color to double the rent and to build houses.</li>
        <li><b>Manage properties</b> flies the camera to each property you own. Build houses or mortgage from there. A mortgaged property earns no rent until you unmortgage it (mortgage plus 10 percent).</li>
        <li><b>View deeds</b> shows anyone's title deeds. <b>Trade</b> swaps cash and properties with another player.</li>
        <li>Doubles give you another roll. Three doubles in a row sends you to jail.</li>
        <li>Passing GO pays ${fmt(GO_SALARY)}.</li>
        <li>If you owe more than you have, raise cash or go bankrupt. Last player left wins.</li>
        <li>The top bar switches sound, camera zoom, and 3D or flat view.</li>
      </ol>
    </details>
  </div>`;
}

function renderSetup() {
  if (setup.screen === 'host') { renderHostSetup(); return; }
  if (setup.screen === 'join') { renderJoinSetup(); return; }
  if (setup.screen === 'serverLobby') { renderServerLobbySetup(); return; }
  if (setup.screen === 'serverJoin') { renderServerJoinSetup(); return; }
  if (setup.screen === 'friends') { renderFriendsScreen(); return; }
  if (setup.screen === 'boards') { renderBoardsScreen(); return; }
  if (setup.screen === 'boardEditor') { renderBoardEditorScreen(); return; }
  const saved = loadSaved();
  const inputs = Array.from({ length: setup.count }, (_, i) => `
    <label class="muted" for="n${i}">Player ${i + 1}</label>
    <input type="text" id="n${i}" maxlength="14" value="${esc(setup.names[i])}" oninput="setName(${i}, this.value)">`).join('');
  const resume = saved ? `
    <div class="panel acc-blue">
      <h2>🎩 Game in progress</h2>
      <p class="muted">${saved.players.map(p => esc(p.name)).join(', ')}. It is ${esc(saved.players[(saved.turnOrder || saved.players.map((x,i)=>i))[saved.current]].name)}'s turn.</p>
      <button class="btn" onclick="resumeGame()">Resume game</button>
    </div>` : '';
  $('app').innerHTML = `
    <div class="corner-tl">
      <label class="vol-ctrl small" title="Music volume">
        🎵<input type="range" id="volSlider" min="0" max="100" step="1" value="${Math.round(musicVolume * 100)}" oninput="setMusicVolume(this.value)">
      </label>
    </div>
    <div class="setup">
      <div class="setup-logo-wrap"><img src="${LOGO_SRC}" class="setup-logo" alt="MONOPOLY"></div>
      <p class="sub">Custom Edition</p>
      ${resume}
      ${accountPanelHTML()}
      <div class="panel acc-yellow"><h2>Community &amp; creation</h2>
        <div class="row"><button class="btn" type="button" onclick="openFriendsScreen()">Friends</button>
          <button class="btn alt" type="button" onclick="openBoardsScreen(false)">Custom boards</button></div>
        <p class="muted" style="margin-bottom:0">${esc(selectedHostBoard ? `Selected board: ${selectedHostBoard.name}` : 'Selected board: Classic board')}</p>
      </div>
      <div class="panel acc-orange">
        <h2>🎲 Play on one screen</h2>
        <div class="muted">Pass the device around. How many players?</div>
        <div class="seg">${[2, 3, 4, 5, 6, 7, 8].map(n => `<button class="btn ${setup.count === n ? '' : 'alt'}" onclick="setCount(${n})">${n}</button>`).join('')}</div>
        ${inputs}
        <button class="btn" style="width:100%;margin-top:12px" onclick="startGame()">Start game</button>
      </div>
      <div class="panel acc-red">
        <h2>🌐 Play online</h2>
        <div class="row">
          <button class="btn" onclick="backendCreateGame()">Create game</button>
          <button class="btn alt" onclick="openServerJoin()">Join game</button>
          <button class="btn alt" onclick="openServerLobby()">My server games</button>
        </div>
      </div>
      ${howToPlayHTML()}
    </div>`;
}

// Start by showing the setup screen.
renderSetup();
restoreAccountSession();
</script>
</body>
</html>
