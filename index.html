<!--
=====================================================================
  MONOPOLY CANADIAN EDITION
  Pass and play on one screen, 2 to 8 players.
=====================================================================

  The page, styling, and presentation live here. Deterministic game
  state and rule transitions live in game-engine.js, loaded below this
  file's metadata. No install needed. Keep the two files together and
  open index.html in a browser to play.

  WHAT YOU SEE ON SCREEN
  ----------------------
    - Player pills across the top show cash and how many properties
      each player owns. Money changes float out of the pill.
    - The board sits on a table in a 3D tilted view. The camera
      zooms in and follows your piece when it moves.
    - Real 3D dice tumble onto the board.
    - The wooden shelf under the board holds the actions:
      Manage properties, View deeds, Trade, and the main button
      (Roll, End turn, Pay debt).
    - Landing on a free property opens its deed card. Buy it or
      send it to auction.

  HOW THE FILE IS ORGANIZED
  -------------------------
  1. CSS ............ colors, spacing, board, 3D camera, dialogs.
  2. HTML ........... one empty <div id="app">. JavaScript fills it.
  3. JAVASCRIPT is split into numbered sections:
       SECTION 1   Game settings (cash, fines, ANIMATION SPEED)
       SECTION 2   THE BOARD DATA  <-- edit this to make custom properties
       SECTION 3   Chance and Community Chest cards
      SECTION 4   Engine state adapter and UI state
       SECTION 5   Sound effects
      SECTION 6   Engine rule adapters (rent, sets, building, mortgages)
       SECTION 7   Animation helpers (dice, 3D camera, moving pieces)
       SECTION 8   Turn flow (roll, move, land, buy, end turn)
       SECTION 9   Money problems (paying, debt, bankruptcy)
       SECTION 10  Auctions
       SECTION 11  Trading
       SECTION 12  Manage properties, deeds, peek (camera close-ups)
       SECTION 13  Drawing the screen (render functions)
       SECTION 14  Save, player order, setup screen and start

  HOW TO MAKE CUSTOM PROPERTIES
  -----------------------------
  Go to SECTION 2. Every square on the board is one line in the list
  called SPACES. Change the name, price, color group or rents there
  and the whole game updates. Nothing else needs to change.
    - The list MUST keep exactly 40 squares, in board order.
    - Square 0 is GO. Squares go around the board clockwise.
    - New color group? Add it to COLOR_GROUPS in SECTION 2 first.

  HOW TO CHANGE ANIMATION SPEED
  -----------------------------
  SECTION 1 has ANIM_SCALE. 1 is the original speed. 1.4 is the
  current speed. Bigger numbers are slower. It controls piece
  movement, dice, camera, and pop-up effects.

  HOW THE BOARD FILLS THE SCREEN WITHOUT BEING CROPPED
  -----------------------------------------------------
  The board is sized with a "contain" fit, not a fixed pixel size and
  not a full-bleed "cover" crop: it grows to be as big as it can while
  still fitting completely inside whatever space is left after the
  top bar, player pills, caption and dock, on ANY screen size or
  shape, so nothing is ever cut off. This depends on a chain of
  flexbox rules from <body> down to .scene (search this file for
  "PAGE HEIGHT CHAIN" for the full explanation, right above the
  .topbar CSS rule). If the board ever looks cropped, cut off, tiny,
  or stretched again after an edit, that chain is almost always the
  first place to check — a missing "flex: 1" or "min-height: 0" on
  any element in it is the usual cause. Square text (property names,
  prices) scales with the board automatically via cqw units; see the
  comment above .cell's font-size rule before changing text sizing.

  HOW A TURN WORKS (the "phase" idea)
  -----------------------------------
  The game is always in one phase. The buttons on screen depend on it:
     roll     the player must roll (or pay the jail fine)
     buy      the player landed on a property nobody owns
     auction  the player skipped, so everyone bids on it
     debt     the player owes more cash than they hold
     after    the move is finished, the player can manage, trade
              or end the turn

  RULES IN THIS VERSION
  ---------------------
    - Auctions when a player skips a property.
    - Trading cash and properties between players.
    - Mortgages: get half the price, no rent while mortgaged.
      Unmortgage by paying the mortgage plus 10 percent.
    - Houses need a full color set, unmortgaged, to build.
    - Owe more than your cash? Mortgage or sell houses to pay, or
      declare bankruptcy. Last player standing wins.
    - Turn order is decided at random at the start.
    - Saves itself in this browser so you can resume later.
=====================================================================
-->

/* ---------------------------------------------------------------
   1. CSS
   Colors live in variables (--name) so light and dark themes can
   swap them. Spacing uses one scale (--sp1 to --sp5) everywhere so
   gaps stay consistent. The page follows the device theme.
   --k is the animation slowdown, set from ANIM_SCALE in JavaScript.
   --------------------------------------------------------------- */
:root {
  box-sizing: border-box;
  /* Keeps content clear of phone notches and bars. Zero on desktop. */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --k: 1.4;

  --accent: #C50007;     /* Monopoly logo red */
  --accent-fg: #ffffff;
  --blue: #1f5fb5;       /* dock buttons */
  --gold: #f2c14e;
  --btn-alt: #e3ebe5;
  --btn-alt-fg: #101a14;
  --scrim: rgba(6, 12, 9, .68);
  --good: #0b6e2f;
  --bad: #b3121f;
  --focus: #ffd23f;
  /* Every button's outline/border -- normal, hover, pressed, selected
     and disabled -- is this one black, so there's a single place to
     change it. Previously several of these read var(--gold) or
     var(--focus) (both yellow), which is what gave buttons a yellow
     rim instead of a clean black one. Non-button elements (the board
     cell's selection glow uses this too, since .cell is itself a
     <button>; the player pill and token dot are plain divs and keep
     --focus). */
  --btn-outline: #000;

  /* --- 10x redesign additions: board trim, parchment & felt-dialog
     palette. These are intentionally NOT swapped by dark mode below --
     the board frame, deed cards and the "felt" dialogs (buy/peek/deeds)
     are meant to always look like a physical game, not a themed app
     surface, so their colors never depend on --panel/--fg. This is
     also the actual fix for the deed-dialog color glitch: the old buy
     dialog inherited var(--panel)/var(--fg), which swap to a near-black
     green + pale mint in dark mode and clashed hard against the
     always-white deed card sitting inside it. See .dialog.felt below. */
  --gold-dark: #8a6a22;
  --gold-bright: #f3d585;
  --felt-1: #0f4a34;
  --felt-2: #0a3324;
  --felt-ink: #f6ead0;
  --parchment-1: #fffdf6;
  --parchment-2: #f4edd9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a2419; --bg2: #071a12; --fg: #eef4ef; --page-fg: #eef4ef; --board: #ceecc6; --sq: #ceecc6; --board-fg: #101a14;
    --room: #071c14; --table: #3b2a22; --wood: #5e4633; --wood-dark: #3a2a1e;
    --cell: #243328; --panel: #1a261f; --border: #5b8068; --muted: #cfe0d5;
    --accent: #C50007; --blue: #2a6cc6; --btn-alt: #2d4136; --btn-alt-fg: #eef4ef;
    --good: #6fe797; --bad: #ff9a90;
  }
}
:root[data-theme="dark"] {
  --bg: #0a2419; --bg2: #071a12; --fg: #eef4ef; --page-fg: #eef4ef; --board: #ceecc6; --sq: #ceecc6; --board-fg: #101a14;
  --room: #071c14; --table: #3b2a22; --wood: #5e4633; --wood-dark: #3a2a1e;
  --cell: #243328; --panel: #1a261f; --border: #5b8068; --muted: #cfe0d5;
  --accent: #C50007; --blue: #2a6cc6; --btn-alt: #2d4136; --btn-alt-fg: #eef4ef;
  --good: #6fe797; --bad: #ff9a90;
}
/* ---------------------------------------------------------------
   PAGE HEIGHT CHAIN — read this before touching layout sizing.
   To make the board grow to fill the screen WITHOUT being cropped,
   the board needs a definite (not auto/content-based) height to fit
   inside. That means every ancestor from <body> down to .scene-wrap
   has to (a) know its own height and (b) pass it down. The chain is:
     body        min-height: 100dvh, flex column   (the floor)
     #app        flex: 1, min-height: 0             (fills body)
     .layout     flex: 1, min-height: 0             (fills #app)
     .stage-col  flex column, min-height: 0         (fills .layout)
     .scene-wrap flex: 1, min-height: 0              (fills stage-col)
     .scene      height: 100%, width: auto, aspect-ratio + max-width:
                 100% (this is the "contain" trick — it fills the
                 tallest/widest box that keeps the board's own square
                 shape, so the whole board is always visible, never
                 cropped, and never overflows either axis)
   IMPORTANT: every flex item in this chain needs min-height: 0
   (flex items default to min-height: auto, which stops them from
   ever shrinking below their content size — that alone silently
   breaks this entire fit-to-screen approach). If you add a new
   wrapper anywhere in this chain, give it min-height: 0 too.
   body uses min-height (not height) so the page can still scroll if
   something (a very small screen, an open dialog) genuinely needs more
   room than the screen -- we want the board to fill the screen, not
   force everything else to be cropped to fit it.
   --------------------------------------------------------------- */
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--page-fg);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.05), transparent 55%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 26px),
    linear-gradient(180deg, var(--bg), var(--bg2));
  font-family: var(--font);
  font-weight: 500; line-height: 1.35;
  min-height: 100dvh; display: flex; flex-direction: column;
}
#app { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
button { font-family: inherit; cursor: pointer; }
/* .cell is itself a <button> (see the board markup), so it's already
   covered by "button:focus-visible" below -- it isn't listed a second
   time. Text inputs aren't buttons, so their focus ring stays the
   original yellow. */
button:focus-visible {
  outline: 3px solid var(--btn-outline); outline-offset: 2px;
}
input:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

/* Brand + top actions now live at the top of the left sidebar instead of
   a full-width bar, so removing them gives the board that whole strip of
   height back. */
.brand { display: flex; flex-direction: column; align-items: center; gap: var(--sp2); text-align: center; }
.brand-name { font-family: var(--font); font-weight: 800; font-size: 1.4rem; letter-spacing: .02em; }
.brand-logo { height: 44px; width: auto; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.brand-sub { font-weight: 800; color: var(--fg); }
.top-actions { display: flex; flex-direction: column; gap: var(--sp2); align-items: stretch; margin: var(--sp3) 0; }
.vol-ctrl { display: flex; align-items: center; gap: var(--sp1); background: #fff; color: #7a0f07; border-radius: var(--r-sm, 8px); padding: var(--sp1) var(--sp2); }
.vol-ctrl input[type="range"] { width: 90px; accent-color: #7a0f07; cursor: pointer; }
.vol-ctrl.small { padding: 3px 8px; font-size: .8rem; gap: 4px; }
.vol-ctrl.small input[type="range"] { width: 60px; }
.zoom-ctrl { gap: var(--sp1); }
.zoom-ctrl input[type="range"] { width: 70px; }
.zoom-btn {
  border: none; background: transparent; color: #7a0f07; font-size: 1.1rem; font-weight: 800;
  line-height: 1; padding: 0 2px; cursor: pointer; border-radius: 4px;
}
.zoom-btn:hover { background: rgba(122,15,7,.12); }

/* Floating corner controls: volume top-left, pause top-right, sitting
   over the board area instead of a full-width bar. */
.corner-tl, .corner-tr {
  position: fixed; top: var(--sp3); z-index: 20;
}
.corner-tl { left: var(--sp3); }
.corner-tr { right: var(--sp3); }



/* Page layout: the board stage, given as much room as the screen
   allows. flex: 1 + min-height: 0 lets this row grow to fill the
   rest of the screen (see the height-chain note above .topbar)
   instead of only being as tall as its content. align-items: stretch
   (the flex default, stated explicitly here so nobody "fixes" it
   back to flex-start) is required so .stage-col actually receives
   that height and can pass it on to the board. On narrow/mobile
   screens .layout stacks everything in one column (pills, board,
   dock); see the @media block right below for how wide screens turn
   that into three side-by-side columns instead. */
.layout {
  display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  padding: var(--sp2); max-width: 1200px; margin: 0 auto; align-items: stretch; justify-content: center; width: 100%; gap: var(--sp1);
}
.stage-col { flex: 1 1 auto; min-width: 0; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: var(--sp2); }
/* DESKTOP / WIDE-SCREEN LAYOUT (1920x1080 and similar)
   Below this width there's enough room to stop stacking the player
   pills and the action shelf above/below the board (which is what
   the narrow/mobile layout above still does) and instead put them in
   two side columns that flank the board. This does two things at
   once: it removes the pills and the dock from the vertical stack,
   so .scene-wrap gets far more height to grow the board into, and it
   puts real UI into what would otherwise be empty space either side
   of a square board sitting inside a 16:9 screen, instead of leaving
   that space blank. .layout switches from a column (mobile: bar,
   board, bar) to a row (desktop: sidebar, board, sidebar); the DOM
   order doesn't change, only the flex direction, so no markup
   duplication is needed for the two layouts. */
@media (min-width: 1100px) {
  .layout { flex-direction: row; max-width: none; width: 100%; padding: var(--sp2) var(--sp3); gap: var(--sp3); }
  .side-left, .side-right { flex: 0 0 clamp(150px, 11vw, 210px); display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .hud { flex: 0 0 auto; }
  .hud-pills { flex-direction: column; align-items: stretch; padding-top: 0; gap: var(--sp3); justify-content: flex-start; }
  .pill { min-width: 0; width: 100%; }
  .dock-row { flex-direction: column; align-items: stretch; gap: var(--sp3); }
  .dock { flex-direction: column; align-items: stretch; width: 100%; }
  .dock-group { flex-direction: column; align-items: stretch; width: 100%; }
  .dbtn { width: 100%; }
  .primary { width: 100%; justify-content: center; }
  .turn-label { text-align: center; }
}

/* PLAYER PILLS (top). One solid color per player. */
.hud { position: relative; flex: 0 0 auto; }
.hud-pills { display: flex; gap: var(--sp3); flex-wrap: wrap; justify-content: center; padding-top: var(--sp2); }
.pill {
  position: relative; display: flex; align-items: center; gap: var(--sp2);
  background: var(--pc); color: #fff; border-radius: 999px;
  padding: var(--sp1) var(--sp5) var(--sp1) var(--sp1); min-width: 160px;
}
.pill .avatar {
  width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--pc);
  display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; flex: none;
}
.pill .ptext { display: flex; flex-direction: column; min-width: 0; }
.pill .pname { font-weight: 700; font-size: .85rem; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill .pmoney { font-weight: 800; font-size: 1.4rem; line-height: 1.1; display: inline-block; transform-origin: left center; }
.pill .pmoney.pop-up { animation: moneyPopUp calc(1.1s * var(--k)) ease-out; }
.pill .pmoney.pop-down { animation: moneyPopDown calc(1.1s * var(--k)) ease-out; }
@keyframes moneyPopUp {
  0%   { transform: scale(1); }
  20%  { transform: scale(1.45); color: #4ade80; text-shadow: 0 0 12px rgba(74,222,128,.9); }
  55%  { transform: scale(1.1); color: #4ade80; text-shadow: 0 0 12px rgba(74,222,128,.9); }
  100% { transform: scale(1); color: inherit; text-shadow: none; }
}
@keyframes moneyPopDown {
  0%   { transform: scale(1); }
  20%  { transform: scale(1.45); color: #f87171; text-shadow: 0 0 12px rgba(248,113,113,.9); }
  55%  { transform: scale(1.1); color: #f87171; text-shadow: 0 0 12px rgba(248,113,113,.9); }
  100% { transform: scale(1); color: inherit; text-shadow: none; }
}
.pill .badge {
  position: absolute; top: -8px; right: -2px; min-width: 24px; height: 24px; padding: 0 6px;
  border-radius: 12px; background: #fff; color: #111; font-weight: 800; font-size: .8rem;
  display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.5);
}
.pill .order {
  position: absolute; top: -8px; left: -2px; min-width: 24px; height: 24px; padding: 0 6px;
  border-radius: 12px; background: #111; color: #fff; font-weight: 800; font-size: .8rem;
  display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.5);
}
.pill.current { outline: 3px solid var(--focus); outline-offset: 3px; }
.pill.out { opacity: .45; text-decoration: line-through; }
.pill.flash-up { animation: pillFlashUp calc(1s * var(--k)) ease-out; }
.pill.flash-down { animation: pillFlashDown calc(1s * var(--k)) ease-out; }
@keyframes pillFlashUp { 0% { box-shadow: 0 0 0 8px #22c55e; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes pillFlashDown { 0% { box-shadow: 0 0 0 8px #ef4444; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hud-floats { position: absolute; inset: 0; pointer-events: none; }
.pfloat {
  position: absolute; transform: translate(-50%, 0); background: #fff; padding: 2px 10px; border-radius: 8px;
  font-weight: 800; font-size: 1.3rem; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.4);
  animation: pfloat calc(1.4s * var(--k)) ease-out forwards; z-index: 4;
}
.pfloat.up { color: #0b6e2f; } .pfloat.down { color: #b3121f; }
@keyframes pfloat { 0% { transform: translate(-50%, -6px); opacity: 1; } 100% { transform: translate(-50%, 34px); opacity: 0; } }
/* THE BIG MONEY TOAST -- the main, hard-to-miss cue for a cash change.
   Sits fixed dead-center over the whole screen (above even the modal
   scrim, z-index 200) so a big rent hit or a lucky card is obvious no
   matter where on the board it happened or what dialog is open. The
   little pill-float and pmoney-pulse effects above still run alongside
   it as a secondary, per-player cue. */
.big-money-layer {
  position: fixed; inset: 0; z-index: 200; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.big-money {
  display: flex; align-items: center; gap: 18px; padding: 18px 36px; border-radius: 26px;
  color: #fff; box-shadow: 0 16px 44px rgba(0,0,0,.5); border: 3px solid rgba(255,255,255,.55);
  animation: bigMoneyPop calc(2.1s * var(--k)) cubic-bezier(.18,.9,.28,1) forwards;
}
.big-money.up { background: linear-gradient(135deg,#3ee077,#0f8a3f); }
.big-money.down { background: linear-gradient(135deg,#f66a70,#b3121f); }
.big-money .bm-text { display: flex; flex-direction: column; }
.big-money .bm-name {
  font-weight: 800; opacity: .92; text-transform: uppercase; letter-spacing: .06em; font-size: 1.05rem;
}
.big-money .bm-amount { font-weight: 900; line-height: 1.05; text-shadow: 0 3px 8px rgba(0,0,0,.4); }
@keyframes bigMoneyPop {
  0%   { transform: scale(.35) translateY(24px); opacity: 0; }
  12%  { transform: scale(1.18) translateY(0); opacity: 1; }
  22%  { transform: scale(1) translateY(0); opacity: 1; }
  75%  { transform: scale(1) translateY(0); opacity: 1; }
  100% { transform: scale(.85) translateY(-36px); opacity: 0; }
}

/* THE SCENE (a 3D stage)
   scene-wrap  measures the available width.
   scene       the "room". It has perspective, so tilted things get depth.
   plane       the table with the board on it. JavaScript moves this
               element to make the camera zoom, follow and tilt.
   board       an 11 x 11 grid. The outer ring holds the 40 squares.
               The first and last row and column are wider (1.5fr)
               because the four corners live there.
   token-layer the player pieces, on top of the board. */
/* THE SCENE (a 3D stage)
   scene-wrap  a flexible box that fills whatever vertical space is
               left in .stage-col (see the height-chain note above
               .topbar). It centers .scene inside itself.
   scene       the "room" and the actual board frame. Sized with the
               classic CSS "contain" trick: height: 100% + width:
               auto + aspect-ratio + max-width: 100% makes it grow
               to fill scene-wrap on whichever axis is tighter, while
               keeping its square-ish shape — so the board is always
               shown in full, never cropped, on any screen size or
               shape. Any empty space left on the other axis (the
               "letterbox" bars) shows scene-wrap's --room color.
   plane       the table with the board on it. JavaScript moves this
               element to make the camera zoom, follow and tilt.
   board       an 11 x 11 grid. The outer ring holds the 40 squares.
               The first and last row and column are wider (1.5fr)
               because the four corners live there.
   token-layer the player pieces, on top of the board. */
.scene-wrap {
  position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.05), transparent 62%),
    var(--room);
  border-radius: 14px;
  /* container-type: size (not just inline-size) is the fix for the board
     getting cropped: it makes cqh (container-query HEIGHT units), not
     just cqw, available below. .scene then sizes itself with min()
     formulas using both cqw and cqh (see .scene.tilt/.flat) so it is
     guaranteed to fit whichever axis -- width or height -- is tighter,
     on any screen shape. The old approach (height:100%; width:auto;
     max-width:100%; aspect-ratio) only clamped the WIDTH axis; on a
     screen where the available box was proportioned differently than
     the board's own aspect ratio, the HEIGHT could still overflow
     .scene-wrap's clipped bounds, cropping the top/bottom of the table.
     This must stay "size" -- if it's ever changed back to
     "inline-size", the cqh units below silently stop working and the
     cropping bug comes back. */
  container-type: size;
}
.scene {
  position: relative; overflow: hidden; background: var(--room); perspective: 250cqw; touch-action: none;
}
/* The largest box that fits BOTH axes of .scene-wrap while keeping the
   exact aspect ratio -- see the comment on .scene-wrap above. */
.scene.tilt { aspect-ratio: 1 / .76; width: min(100cqw, 100cqh / .76); height: min(100cqh, 100cqw * .76); --unsq: 1.35; }   /* --unsq stretches pieces so they look round when tilted */
.scene.flat { aspect-ratio: 1 / 1; width: min(100cqw, 100cqh); height: min(100cqh, 100cqw); --unsq: 1; }
.plane {
  position: absolute; aspect-ratio: 1 / 1; top: 50%;
  transition-property: transform; transition-timing-function: ease-in-out; transition-duration: 0ms;
  container-type: inline-size;
  transform-style: preserve-3d; backface-visibility: hidden; will-change: transform;
}
/* Both modes share the same footprint: the plane (board) is sized well
   inside .scene, leaving room around it for the wooden table
   (.plane::before, below) to be drawn AND stay fully inside .scene's
   clipped bounds -- including once rotateX/translateZ (tilt mode) or a
   camera zoom makes the plane appear larger. Flat mode used to fill the
   plane to 100% of .scene with zero margin, which left the table with
   nowhere to render at all (it was clipped in its entirety, on every
   screen size). Tilt mode's old 82% margin was also too tight once you
   add the table's own outward inset below, so corners of the table
   could clip during rotation. See PLANE_MARGIN / TABLE_INSET below.
   Tilt mode also carries a real 42-degree rotateX (see CAM.tilt.a):
   under perspective, that foreshortens the near edge of the table
   toward the viewer enough to push it past even the margin below on
   some screens -- corners poking out at the very edges of .scene-wrap
   is that, not a leftover of the old aspect-ratio bug. 72%/margin 14%
   leaves a much bigger cushion than the old 80%/10% did. */
.scene.tilt .plane { width: 76%; left: 12%; margin-top: -38%; }
.scene.flat .plane { width: 80%; left: 10%; margin-top: -40%; }
.plane::before {     /* the wooden table around the board */
  /* PLANE_MARGIN (80% plane width, 10% margin each side) + TABLE_INSET
     (-7%, i.e. the table extends 7% of the plane's own size beyond the
     plane on every edge) together must add up to less than the 100%
     the plane's containing block (.scene) actually clips to:
       80% * (1 + 2*0.07) = 91.2% of .scene's width/height
     leaving a safety cushion (4.4% of .scene per edge) so the table
     stays fully visible even as perspective/rotation/zoom make it read
     slightly larger on screen. If you make the board bigger (raising
     the 80% above) or the table thicker (making -7% more negative),
     re-check that this total stays comfortably under 100% -- that
     margin is what stops the table from being cropped again. */
  content: ''; position: absolute; inset: -7%; border-radius: 3%; z-index: -1;
  background:
    linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.4)),
    var(--table-img) center / 260px 174px repeat, var(--table);
  /* A carved double-molding edge (light bevel then a dark groove)
     around the wood, plus the original deep inner shadow, so the
     table reads as a built game-table frame rather than a flat
     texture fill. */
  box-shadow:
    inset 0 0 0 clamp(2px, .6cqw, 10px) rgba(255,255,255,.08),
    inset 0 0 0 clamp(4px, 1.1cqw, 18px) rgba(0,0,0,.35),
    inset 0 0 40px rgba(0,0,0,.5),
    0 10px 30px rgba(0,0,0,.5);
}
.board {
  /* Supersampling: this box is deliberately rendered at TWICE the size
     of .plane (the space it actually has to fill), then scaled back
     down by half below. Since .board uses container queries (cqw) for
     every square's font size and icon size, doubling its own box means
     all of that text and artwork is laid out, and rasterized, from
     twice as many source pixels for the exact same on-screen size. That
     is what keeps the squares and deed text readable once the camera
     zooms in (Manage properties, following a move) instead of visibly
     smearing a small image up to a bigger one. */
  position: absolute; left: 50%; top: 50%; width: 200%; height: 200%;
  margin-left: -100%; margin-top: -100%; transform: scale(0.5); transform-origin: 50% 50%;
  display: grid; color: var(--board-fg);
/* PROPERTY OUTLINES: the hairline that separates every square is drawn
   by this background colour showing through a grid "gap", not by a
   per-cell border. A per-cell border would double up (and look twice
   as thick) on every shared edge between two squares -- this way each
   seam is exactly one gap wide everywhere on the board, corners
   included, matching the real board's crisp, even grid. The gap is a
   cqw value (like the text sizing above) so the line stays the same
   *relative* thickness whether the board is small on a phone or blown
   up by the zoomed-in camera, instead of turning chunky or vanishing. */
  background: var(--line);
  gap: clamp(2px, .32cqw, 6px);
  grid-template-columns: 1.5fr repeat(9, 1fr) 1.5fr;
  grid-template-rows: 1.5fr repeat(9, 1fr) 1.5fr;
  container-type: inline-size; border: clamp(3px, .7cqw, 11px) solid var(--line); border-radius: 2px;
  /* Decorative frame: a bright gold pinstripe, a dark outline, and a
     deep drop shadow -- layered with box-shadow (not border) so it
     costs no layout and can't disturb the cqw-based grid above. */
  box-shadow:
    0 0 0 clamp(2px, .45cqw, 9px) var(--gold),
    0 0 0 calc(clamp(2px, .45cqw, 9px) + clamp(1.5px, .32cqw, 6px)) #1b0f04,
    0 clamp(10px, 2.4cqw, 46px) clamp(20px, 5cqw, 90px) rgba(0,0,0,.6);
}

/* One square. Its content sits in .cell-in, which is turned so the
   text faces outward, like a real board. Squares get their colour
   from this background only -- the dark seam around each one is the
   .board background showing through the grid gap above, so every
   square reads as the same clean rectangle at any zoom level. */
.cell {
  position: relative; display: block; color: var(--board-fg);
  /* A soft top-lit sheen plus a faint inner edge over the flat square
     color, so every space reads as a slightly raised, printed card
     instead of a plain colored rectangle. */
  background:
    linear-gradient(165deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.12) 18%, rgba(255,255,255,0) 40%),
    var(--sq);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
/* Font size uses cqw (percent of .board's own width) so text scales
   automatically with however big the contain-fit board ends up being
   on a given screen (see the .scene-wrap notes above .topbar) — a
   bigger board gets bigger text, a smaller one gets smaller text,
   with NO extra JS needed. The clamp() floor/ceiling only exist as a
   safety net for genuinely extreme cases (a tiny embedded window, a
   huge signage display); they're set far outside the cqw value any
   normal screen or Chrome page-zoom level (its Ctrl+/Ctrl- zoom
   resizes the CSS viewport, which resizes the board, which resizes
   cqw) would ever reach, so the text keeps scaling in lockstep with
   the board — never "stuck" at a ceiling while the board keeps
   growing, or vice versa — through the whole normal zoom range. If
   you need bigger text everywhere, raise the middle (cqw) number,
   not just the ceiling — raising only the ceiling does nothing until
   the board is already big enough to reach it. .cell's overflow:
   hidden means text that no longer fits its square gets silently
   clipped rather than visibly broken, so always test the smallest
   expected board size (a phone in portrait) after any change here. */
  font-size: clamp(9px, 1.39cqw, 27px); text-align: center; overflow: hidden; padding: 0; cursor: pointer;
}
.cell-in {
  position: absolute; left: 50%; top: 50%; width: 8.333cqw; height: 12.5cqw;
  display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%);
}
.cell.corner .cell-in { width: 12.5cqw; justify-content: center; }
.cell .bar {
  position: relative; width: 100%; height: 22%; min-height: 4px; display: flex; align-items: center; justify-content: center; gap: 1px;
  border-bottom: clamp(2px, .32cqw, 6px) solid var(--line);
  box-shadow: inset 0 -3px 5px rgba(0,0,0,.16);
}
/* Glossy top highlight over the color strip -- an overlay, not a blend
   with the inline background-color, so it works for every group color
   the same way with zero JS/markup changes. */
.cell .bar::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%, rgba(0,0,0,.1));
  pointer-events: none;
}
.cell .name {
  font-weight: 800; padding: 3px 3px 0; line-height: 1.12; letter-spacing: .01em;
  text-shadow: 0 1px 0 rgba(255,255,255,.35);
  /* Wrap only at spaces by default, so a name never gets chopped mid-word
     (e.g. "Connecticu" / "t Avenue"). JS shrinks the font per-square until
     the whole name fits wrapped at spaces; only if a single word is still
     too wide even at the smallest allowed size does JS fall back to
     .name.hyphenate below, which permits a mid-word break as a last resort. */
  word-break: normal; overflow-wrap: normal; hyphens: none;
  font-size: calc(1em * var(--nscale, 1));
}
.cell .name.hyphenate { word-break: break-word; overflow-wrap: break-word; }
.cell .price {
  margin-top: auto; margin-bottom: 5px; padding: 1px 7px; color: #33402f; font-weight: 800;
  background: rgba(0,0,0,.07); border-radius: 999px; font-size: .88em; box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
}
.cell .icon {
  position: relative; margin-top: 5%; height: 2.5em; width: 2.5em; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,255,255,.15) 60%, rgba(0,0,0,.06));
  box-shadow: 0 1px 3px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.08);
}
.cell .icon svg, .cell .icon img { width: 1.6em; height: 1.6em; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.cell .icon .glyph { font-size: 1.5em; font-weight: 800; color: #d9631c; line-height: 1; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
.cell.corner .name { font-size: 1.3em; letter-spacing: .03em; }
.cell.corner .cell-in.full-art { width: 100%; height: 100%; padding: 0; box-sizing: border-box; justify-content: center; overflow: hidden; }
.cell-in.full-art img { width: 100%; height: 100%; object-fit: contain; display: block; transform: rotate(45deg) scale(1.42); }
.cell.selected { outline: 3px solid var(--btn-outline); outline-offset: -3px; z-index: 3; box-shadow: 0 0 0 2px #000, 0 0 18px 4px var(--btn-outline); }
.cell.is-mortgaged .name, .cell.is-mortgaged .price, .cell.is-mortgaged .bar { opacity: .45; }
.mort-tag {
  position: absolute; left: 6%; right: 6%; top: 40%; background: linear-gradient(180deg,#2a2a2a,#111);
  color: #fff; font-weight: 800; padding: 3px 0; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
  transform: rotate(-4deg);
}
.house { width: .95em; height: .95em; background: linear-gradient(160deg,#3fcf74,#0f7a34); border: 1px solid #0b5c26; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.hotel { width: 1.9em; height: .95em; background: linear-gradient(160deg,#f0524a,#b31c1c); border: 1px solid #6b0f0f; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.owner-strip { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; box-shadow: 0 -1px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4); }
/* Owned tiles get a colored glow ring all the way around the square, so
   who owns what reads at a glance from across the whole board -- not just
   from the thin strip at the bottom. */
.cell.owned {
  box-shadow:
    inset 0 0 0 clamp(2px, .55cqw, 6px) var(--owner-color),
    0 0 clamp(4px, 1.2cqw, 14px) clamp(1px, .3cqw, 3px) var(--owner-color);
  z-index: 1;
}
.cell.owned.selected { z-index: 3; }
/* Small round badge (owner's initial, in their color) pinned to a corner
   of the square -- a second, always-visible cue on top of the glow and
   the strip. */
.owner-badge {
  position: absolute; top: 3%; right: 3%; width: 20%; aspect-ratio: 1; min-width: 12px; max-width: 26px;
  border-radius: 50%; display: grid; place-items: center; font-weight: 900;
  font-size: 62%; border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 1px 3px rgba(0,0,0,.5); z-index: 2;
}
.fresh { animation: pop calc(.5s * var(--k)) ease-out; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }

/* Player pieces. left/top are set in JavaScript. The transition makes
   them slide from square to square. --step is set per move. */
.token-layer { position: absolute; inset: 0; pointer-events: none; --step: .3s; }
.tk {
  position: absolute; --tk: clamp(13px, 2.09cqw, 45px);
  width: var(--tk); height: var(--tk); margin-left: calc(var(--tk) / -2); margin-top: calc(var(--tk) / -2);
  transform: scaleY(var(--unsq, 1)); transform-origin: 50% 85%;
  transition: left var(--step) linear, top var(--step) linear, opacity .2s ease; z-index: 5;
}
.tk::after {           /* soft shadow that stays on the board while the piece hops */
  content: ''; position: absolute; left: 8%; right: 8%; bottom: -10%; height: 32%;
  background: rgba(0,0,0,.4); border-radius: 50%; z-index: -1;
}
.tk-dot {
  width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; color: #fff;
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--pc) 60%, #fff), var(--pc) 55%, color-mix(in srgb, var(--pc) 80%, #000) 100%);
  box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.5); display: grid; place-items: center;
  font-weight: 800; font-size: calc(var(--tk) * .5); text-shadow: 0 1px 2px rgba(0,0,0,.5);
}
.tk.active .tk-dot { outline: 3px solid var(--focus); }

/* Center of the board: title, two card decks, dice */
/* Renamed from .center to .board-center: "center" is also used all over
   the file as a plain utility class (class="row center" to flex-center a
   row of buttons). Class selectors match by name anywhere in the page,
   so this board-only rule (with its felt texture and green background)
   was also silently painting itself behind every "row center" button
   row in every dialog -- the light green diagonal-hatched bar behind
   Buy/Auction/Manage properties etc. Giving the board's own element a
   name nothing else uses stops that collision for good. */
.board-center {
  grid-area: 2 / 2 / 11 / 11; position: relative; --d: clamp(23px, 4.19cqw, 84px);
  /* the middle needs its own fill now that .board's background is the
     grid-line colour -- plus a soft vignette and a faint fabric weave
     so the middle reads as a felt playing surface, not a flat tint. */
  background:
    radial-gradient(ellipse 62% 56% at 50% 46%, rgba(255,255,255,.18), transparent 68%),
    radial-gradient(ellipse 90% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.10) 100%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.022) 0 2px, transparent 2px 28px),
    var(--board);
  box-shadow: inset 0 0 0 clamp(2px, .45cqw, 8px) rgba(0,0,0,.1);
}
/* A faint dashed compass ring behind the logo -- purely decorative,
   gives the center a "designed medallion" focal point instead of
   empty green plus a floating logo. */
.title {
  position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%) rotate(-4deg); white-space: nowrap;
  font-family: var(--font); font-weight: 800; font-size: clamp(18px, 3.9cqw, 73px);
  color: var(--accent); letter-spacing: .02em; line-height: 1;
}
.logo-diag {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-45deg);
  display: flex; flex-direction: column; align-items: center; gap: .35em;
}
.logo-diag::before {
  /* soft warm glow + a faint dashed compass ring behind the logo, so
     the medallion has a designed focal point instead of a flat green
     backdrop */
  content: ''; position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  width: 135%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.35), transparent 62%);
}
.logo-diag::after {
  /* four tiny sparkle accents around the medallion ring */
  content: '✦ ✦ ✦ ✦'; position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  width: 150%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  color: rgba(255,255,255,.55); font-size: clamp(8px, 1.4cqw, 20px);
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 2% 6%;
}
.board-logo { width: clamp(196px, 47cqw, 651px); height: auto; filter: drop-shadow(0 .5cqw .1cqw rgba(0,0,0,.35)); display: block; position: relative; z-index: 1; }
.edition {
  position: relative; z-index: 1;
  font-weight: 800; font-size: clamp(8px, 1.21cqw, 24px); white-space: nowrap; color: #3a2a10;
  letter-spacing: .18em; text-transform: uppercase; padding: .15em .9em; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.15));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.15), 0 .3cqw .5cqw rgba(0,0,0,.2);
}
.deck {
  position: absolute; width: 17%; height: 12%; border-radius: 8%; display: grid; place-items: center;
  font-weight: 800; border: 2px solid rgba(0,0,0,.25);
  box-shadow: 0 .7cqw 0 var(--edge), 0 1.3cqw 0 rgba(0,0,0,.3), inset 0 .15cqw 0 rgba(255,255,255,.4);
}
.deck.chance { --edge: #a86d12; background: linear-gradient(155deg,#f3b969,#e08e1f); top: 8%; right: 5%; transform: rotate(22deg); color: #6b1f0a; font-size: 4cqw; text-shadow: 0 1px 1px rgba(255,255,255,.4); }
.deck.chest { --edge: #1f5c8f; background: linear-gradient(155deg,#7cc1ef,#3d89c9); bottom: 8%; left: 5%; transform: rotate(-18deg); color: #0b2d4a; }
.deck.chest svg { width: 55%; height: 65%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.dice-anchor {
  position: absolute; left: 52%; top: 66%; transform: translate(-50%, -50%);
  padding: 14%; border-radius: 50%;
}
.dice { display: flex; gap: calc(var(--d) * .7); }
.die3d { position: relative; width: var(--d); height: var(--d); perspective: calc(var(--d) * 6); }
.die3d::after {        /* shadow under each die */
  content: ''; position: absolute; left: 10%; right: -14%; bottom: -14%; height: 26%;
  background: rgba(0,0,0,.3); border-radius: 50%; z-index: -1;
}
.cube { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-26deg) rotateY(30deg); }
.face {
  position: absolute; inset: 0; background: #fff; border: 2px solid #111; border-radius: 14%; backface-visibility: hidden;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 12%;
}
.f-front  { transform: translateZ(calc(var(--d) / 2)); }
.f-back   { transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }
.f-right  { transform: rotateY(90deg) translateZ(calc(var(--d) / 2)); }
.f-left   { transform: rotateY(-90deg) translateZ(calc(var(--d) / 2)); }
.f-top    { transform: rotateX(90deg) translateZ(calc(var(--d) / 2)); }
.f-bottom { transform: rotateX(-90deg) translateZ(calc(var(--d) / 2)); }
.pip { width: 74%; height: 74%; border-radius: 50%; background: transparent; place-self: center; }
.pip.on { background: #111; }

/* Manage-properties overlay (sits on top of the scene) */
.mg { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.mg > * { pointer-events: auto; }
.mg-title { position: absolute; top: var(--sp3); left: var(--sp3); background: #1d2124; color: #fff; padding: var(--sp2) var(--sp3); border-radius: var(--radius); font-weight: 800; }
.mg-exit { position: absolute; top: var(--sp3); left: 50%; transform: translateX(-50%); background: #c00000; color: #fff; border: 0; border-radius: var(--radius); padding: var(--sp2) var(--sp5); font-weight: 800; font-size: 1.2rem; }
.mg-arrow { position: absolute; top: 45%; background: #3d3a38; color: #fff; border: 0; border-radius: var(--radius); padding: var(--sp3) var(--sp4); font-weight: 800; font-size: 1rem; }
.mg-arrow.left { left: var(--sp3); } .mg-arrow.right { right: var(--sp3); }
.mg-panel {
  position: absolute; bottom: var(--sp3); width: min(46%, 230px); background: #2b2f33; color: #fff;
  border-radius: 10px; padding: var(--sp3); text-align: center;
}
.mg-panel.houses { left: var(--sp3); } .mg-panel.mort { right: var(--sp3); }
.mg-panel h3 { margin: 0 0 var(--sp2); text-decoration: underline; font-size: 1.15rem; }
.mg-panel .line { margin: var(--sp2) 0; display: flex; gap: var(--sp2); align-items: center; justify-content: center; flex-wrap: wrap; }
.mg-panel .small { font-size: .78rem; opacity: .9; }
.mg-panel .good { color: #6fe797; font-weight: 800; } .mg-panel .badc { color: #ff9a90; font-weight: 800; }
.mg-btn { border: 0; border-radius: 6px; padding: var(--sp1) var(--sp3); font-weight: 800; font-size: 1rem; background: #4a4f54; color: #fff; }
.mg-btn.plus { background: #14a44d; } .mg-btn.mort-btn { background: #d62828; }
.mg-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Caption, shelf and turn label under the scene */
.caption { flex: 0 0 auto; min-height: 2.7em; text-align: center; font-weight: 700; }
.caption div { opacity: .75; } .caption div:last-child { opacity: 1; font-weight: 800; }
.dock-row { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp3); justify-content: space-between; }
.dock {
  flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: var(--sp4); align-items: center; justify-content: center;
  background: var(--table-img) center / 180px 120px repeat, var(--wood);
  border-radius: 14px; padding: var(--sp3) var(--sp4); box-shadow: 0 4px 0 var(--wood-dark);
}
/* Two clusters inside the shelf: property actions (manage/deeds/trade) on
   one side, the turn's main action (roll/end turn/pay debt/bankrupt) on
   the other -- grouped so related buttons sit together instead of being
   one flat row. The divider only shows when both groups share a row; it
   disappears on its own once .dock wraps them onto separate lines on a
   narrow screen, since there's nothing to divide at that point. */
.dock-group { display: flex; flex-wrap: wrap; gap: var(--sp3); align-items: center; justify-content: center; }
.dock-group.props { padding-right: var(--sp4); border-right: 2px solid rgba(0,0,0,.25); }
@media (max-width: 560px) { .dock-group.props { padding-right: 0; border-right: 0; } }
/* On the wide desktop sidebar layout the buttons stack vertically (see
   the min-width:1100px block above .dock-row), so a divider between
   the two clusters needs to run horizontally, not vertically. This
   rule must come AFTER the plain .dock-group.props rule above so it
   actually wins the cascade at this width -- putting it inside the
   earlier layout media query (same specificity, but earlier in the
   file) was the actual cause of the stray vertical bar always
   showing even in the stacked desktop layout. */
@media (min-width: 1100px) {
  .dock-group.props { padding-right: 0; padding-bottom: var(--sp3); border-right: 0; border-bottom: 2px solid rgba(0,0,0,.25); }
}
.dbtn {
  background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 100%, white 18%), var(--blue));
  color: #fff; border: 3px solid var(--btn-outline); border-radius: 12px;
  padding: calc(var(--sp2) * 1.4) calc(var(--sp4) * 1.3); font-weight: 800; font-size: 1.15rem;
  box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .12s ease, box-shadow .12s ease;
}
.dbtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4); }
.dbtn:disabled { opacity: .45; cursor: not-allowed; }
.primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 100%, white 20%), var(--accent));
  color: #fff; border: 0; border-bottom: 5px solid rgba(0,0,0,.35); border-radius: 14px;
  padding: calc(var(--sp3) * 1.25) calc(var(--sp5) * 1.25); font-weight: 800; font-size: 1.75rem; display: inline-flex; gap: var(--sp2); align-items: center;
  box-shadow: 0 6px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4);
  transition: transform .12s ease, box-shadow .12s ease;
}
.primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.45); }
.primary:active:not(:disabled) { transform: none; border-bottom-width: 2px; }
.primary:disabled { opacity: .5; cursor: not-allowed; }
.primary svg { width: 40px; height: 40px; }
.turn-label { font-weight: 800; font-size: 1.15rem; text-align: right; line-height: 1.2; }

/* Buttons. Subtle gradient + soft lift on hover for a more polished feel. */
.btn {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 100%, white 15%), var(--accent));
  color: var(--accent-fg); border: 2px solid transparent; border-radius: var(--radius);
  padding: calc(var(--sp2) * 1.3) calc(var(--sp4) * 1.25); font-weight: 800; font-size: 1.05rem;
  box-shadow: 0 1px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn.alt { background: linear-gradient(180deg, color-mix(in srgb, var(--btn-alt) 100%, white 10%), var(--btn-alt)); color: var(--btn-alt-fg); border-color: var(--border); }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3); }
.btn:active:not(:disabled) { transform: none; box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.mini {
  border: 1px solid var(--border); background: var(--btn-alt); color: var(--btn-alt-fg);
  border-radius: 6px; padding: var(--sp1) var(--sp2); font-weight: 800; font-size: .8rem;
}

/* Side panels */
.panel { background: var(--panel); color: var(--fg); border: 2px solid var(--border); border-radius: 10px; padding: var(--sp3); box-shadow: 0 4px 10px rgba(0,0,0,.12); }
.panel h2 { margin: 0 0 var(--sp2); font-size: 1.05rem; font-weight: 800; }
.tag { font-size: .75rem; background: var(--btn-alt); color: var(--btn-alt-fg); border-radius: 4px; padding: 0 var(--sp1); font-weight: 700; }
.tag.ok { background: #00A650; color: #fff; }
.tag.wait { background: #F57F1C; color: #fff; }
.muted { color: var(--muted); font-size: .85rem; }

/* Title deed card: always paper (parchment), like the real thing --
   a warm off-white gradient + soft edge shadow instead of flat #fff,
   so it reads as a printed card sitting on the table, not a plain div. */
.deed {
  background: linear-gradient(165deg, var(--parchment-1), var(--parchment-2));
  color: #1c1406; border: 2px solid #1c1406; border-radius: 3px; padding: 6px; width: 100%; max-width: 300px; margin: 0 auto; text-align: left;
  box-shadow: 0 10px 24px rgba(0,0,0,.4), 0 2px 0 rgba(255,255,255,.5) inset;
}
.deed-in { border: 1.5px solid #1c1406; padding: 6px 8px; }
.deed-head { text-align: center; padding: 7px 6px; border: 1.5px solid #1c1406; margin-bottom: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), inset 0 -10px 14px -8px rgba(0,0,0,.2); }
.deed-head small { display: block; font-size: .65rem; font-weight: 700; letter-spacing: .12em; }
.deed-head b { font-size: 1.05rem; }
.deed .r { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; padding: 2px 0; }
.deed .r b { font-weight: 800; }
.deed hr { border: 0; border-top: 1px solid #1c1406; margin: 6px 0; opacity: .55; }
.deed .note { font-size: .68rem; }
.deed .stat { text-align: center; font-weight: 800; font-size: .8rem; margin-top: 6px; letter-spacing: .02em; }
.hicon { width: 18px; height: 18px; vertical-align: middle; }

/* Dialogs */
.scrim {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim);
  display: flex; align-items: center; justify-content: center; padding: var(--sp3); overflow-y: auto;
}
.dialog {
  background: var(--panel); color: var(--fg); border: 2px solid var(--border); border-radius: 12px;
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: var(--sp4);
}
.dialog.wide { max-width: 860px; }
.dialog.plain { background: transparent; border: 0; color: #fff; text-align: center; }
/* --- THE COLOR-GLITCH FIX ---
   Deed-related dialogs (buy / auction / peek / deeds) used to inherit
   the plain var(--panel)/var(--fg) theme colors, which flip to a
   near-black green panel + pale mint text in dark mode. That combo
   sitting directly under the always-white/parchment deed card is what
   read as a "glitch": two unrelated color systems stacked in one
   dialog, changing depending on the visitor's OS theme. .dialog.felt
   below is a single, deliberately designed surface -- a felt-and-gold
   frame with a warm ink color -- that never reads from --panel/--fg,
   so it looks identical for host and guest, light or dark system
   theme, on open, on re-render (multiplayer state updates just
   replace this same markup), and on close. */
.dialog.felt {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(180deg, var(--felt-1), var(--felt-2));
  color: var(--felt-ink);
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 6px var(--felt-2), 0 0 0 8px var(--gold-dark), 0 22px 55px rgba(0,0,0,.6);
}
.dialog.felt h2 { color: var(--gold-bright); }
/* This was #cfe3d2 -- a cool mint green left over from an earlier pass
   at the color-glitch fix above. Every other color in this dialog
   (the border, the h2, the buy price, the "muted" text everywhere
   else in the app) comes from the warm felt/gold/parchment family;
   this one cool green swatch is what still reads as a stray "light
   green glitch" on top of it -- most visible in the "Waiting for
   ___ to decide..." line a non-active player (host or guest) sees
   while this dialog is open. Dimming --felt-ink itself keeps it in
   the same warm family as the rest of the dialog instead of
   introducing an unrelated hue, so it can't drift back out of sync
   with it during theme changes, re-renders, or multiplayer syncs. */
.dialog.felt .muted { color: rgba(246, 234, 208, .68); }
.dialog.felt .error { color: #ff9d90; font-weight: 800; }
.dialog.felt .btn.alt { background: #eee6cf; color: #201705; border-color: var(--btn-outline); }
.dialog.felt .pick { background: linear-gradient(180deg, #f6efd9, #e9dfc0); color: #201705; border-color: var(--btn-outline); }
.dialog.felt .deeds-list { background: rgba(0,0,0,.18); border-color: var(--gold-dark); }
.dialog.felt .deeds-list h3 { color: var(--gold-bright); }
.dialog.felt .dialog .row.center, .dialog.felt .row.center { justify-content: center; }
.dialog.felt input[type=number] { background: #f6efd9; color: #201705; border-color: var(--gold-dark); }
.dialog.enter { animation: dlg calc(.2s * var(--k)) ease-out; }
@keyframes dlg { 0% { transform: scale(.94); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.dialog h2 { margin: 0 0 var(--sp3); font-size: 1.2rem; }

/* Pause overlay: sits above everything, including the modal scrim, and
   blocks every click while the host has the game paused. */
.pause-overlay {
  display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.72);
  flex-direction: column; align-items: center; justify-content: center; gap: var(--sp3);
}
.pause-overlay .pause-text {
  font-family: var(--font); font-weight: 800; color: #fff;
  font-size: clamp(2.4rem, 8vw, 5rem); letter-spacing: .1em; text-shadow: 0 4px 0 rgba(0,0,0,.5);
}

/* Trade timer badge (dock) and the all-players "View Trade" button (topbar) */
.trade-timer {
  font-weight: 800; font-size: .85rem; padding: 2px 10px; border-radius: 999px;
  background: var(--btn-alt); color: var(--btn-alt-fg); align-self: center;
}
.trade-timer.low { background: #b23a2a; color: #fff; }
.view-trade-btn { animation: dlg calc(.2s * var(--k)) ease-out; }

/* Visual chip rows for reviewing a trade (sent, postponed, or completed) --
   a colored swatch per property instead of a plain comma-separated line. */
.trade-summary { margin-bottom: var(--sp3); }
.trade-visual { display: flex; flex-wrap: wrap; gap: 6px; }
.trade-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 8px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  font-size: .85rem; font-weight: 600;
}
.trade-chip .swatch { width: 11px; height: 11px; border-radius: 3px; }
.trade-chip.cash { background: rgba(90,200,120,.16); border-color: rgba(90,200,120,.4); color: #8fe3a8; }
.trade-chip.empty { opacity: .55; font-style: italic; font-weight: 400; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); margin-bottom: var(--sp3); }
.dlg-head h2 { margin: 0; }
.dialog .row { display: flex; gap: var(--sp2); flex-wrap: wrap; align-items: center; margin: var(--sp2) 0; }
.dialog .row.center { justify-content: center; }
.dialog .head { padding: var(--sp2) var(--sp3); border-radius: 6px; font-weight: 800; margin-bottom: var(--sp3); }
.dialog input[type=number], .setup input[type=text] {
  padding: var(--sp2) var(--sp3); border-radius: 6px; border: 2px solid var(--border); background: var(--cell); color: var(--fg); font: inherit; width: 8rem;
}
.dialog .cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
.dialog .col { border: 1px solid var(--border); border-radius: 8px; padding: var(--sp2) var(--sp3); }
.dialog .col h3 { margin: 0 0 var(--sp2); font-size: .95rem; }
.chk { display: flex; align-items: center; gap: var(--sp2); padding: var(--sp1) 0; font-size: .9rem; }
.swatch { width: 12px; height: 12px; flex: none; border: 1px solid rgba(0,0,0,.4); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); flex: none; }
.error { color: var(--bad); font-weight: 800; margin: var(--sp2) 0; }
.pick { display: block; width: 100%; text-align: left; background: var(--btn-alt); color: var(--btn-alt-fg); border: 2px solid var(--border); border-radius: 8px; padding: var(--sp3); margin: var(--sp2) 0; font-size: 1.15rem; font-weight: 800; }
.pick:hover { transform: translateY(-1px); }
.pick small { display: block; font-weight: 500; }

/* Buy dialog */
.buy-q { text-align: center; font-size: 1.4rem; font-weight: 800; margin-top: var(--sp3); color: var(--felt-ink); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.buy-price {
  text-align: center; font-size: 2rem; font-weight: 800; color: var(--gold-bright);
  text-shadow: 0 2px 6px rgba(0,0,0,.5); letter-spacing: .02em;
}
.round {
  width: 92px; border: 0; border-radius: 16px; padding: var(--sp2) 0 var(--sp1); color: #fff; font-weight: 800; font-size: .95rem;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3);
  transition: transform .1s ease, box-shadow .1s ease;
}
.round svg { width: 38px; height: 38px; }
.round.ok { background: linear-gradient(180deg,#28c25a,#0f7a34); } .round.no { background: linear-gradient(180deg,#e85a54,#a3121f); }
.round:hover:not(:disabled) { transform: translateY(-2px); }
.round:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); }
.round:disabled { opacity: .45; cursor: not-allowed; }

/* Deeds dialog */
.deeds-grid { display: grid; grid-template-columns: 240px 1fr 170px; gap: var(--sp3); align-items: start; }
@media (max-width: 720px) { .deeds-grid { grid-template-columns: 1fr; } }
.deeds-list { border: 1px solid var(--border); border-radius: 8px; padding: var(--sp3); min-height: 160px; }
.deeds-list h3 { margin: 0 0 var(--sp2); }
.deed-mini { width: 92px; background: #fff; color: #111; border: 1px solid #777; border-radius: 4px; padding: 0 0 4px; margin: 0 var(--sp2) var(--sp2) 0; text-align: center; font-size: .7rem; font-weight: 800; vertical-align: top; }
.deed-mini .dm-head { display: block; height: 16px; }
.deed-mini .dm-name { display: block; padding: 3px 3px 0; }
.deed-mini.sel { outline: 3px solid var(--btn-outline); }

/* Order intro */
.intro h2 { font-family: var(--font); font-weight: 800; font-size: clamp(22px, 5vw, 40px); color: #fff; }
.intro-row { display: flex; gap: var(--sp5); justify-content: center; flex-wrap: wrap; margin: var(--sp4) 0; }
.avatar.big { width: 84px; height: 84px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; font-size: 2.2rem; font-weight: 800; margin: 0 auto var(--sp2); border: 4px solid #fff; }
.rank { font-size: 1.8rem; font-weight: 800; min-height: 1.4em; }
.rank.pop { animation: pop calc(.5s * var(--k)) ease-out; }

/* Setup screen */
.setup { max-width: 560px; margin: var(--sp5) auto; padding: var(--sp3); }
.setup h1 { font-family: var(--font); color: #ff5a4a; font-size: clamp(34px, 12vw, 62px); margin: 0; font-weight: 800; line-height: 1.05; }
.setup-logo-wrap {
  position: relative; margin: 0; padding: var(--sp4) 0 0;
  display: flex; justify-content: center;
}
.setup-logo-wrap::before {
  content: ""; position: absolute; inset: -10% -5%; z-index: 0; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.16), transparent 70%);
}
.setup-logo { width: min(100%, 340px); height: auto; display: block; margin: 0 auto; position: relative; z-index: 1;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
.setup .sub {
  font-family: var(--font); font-weight: 800; font-size: 1.5rem; letter-spacing: .02em;
  margin: calc(-1 * var(--sp3)) 0 var(--sp3); text-align: center; color: var(--gold);
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.setup .panel {
  margin-bottom: var(--sp4); position: relative; overflow: hidden; padding-top: calc(var(--sp3) + 6px);
  border-radius: 12px; border-width: 2px; box-shadow: 0 8px 20px rgba(0,0,0,.35);
}
.setup .panel::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--accent-bar, var(--accent));
}
.setup .panel h2 { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; }
.setup .panel.acc-blue { --accent-bar: #4aa3d8; }
.setup .panel.acc-orange { --accent-bar: #F57F1C; }
.setup .panel.acc-red { --accent-bar: #ED2023; }
.setup .panel.acc-yellow { --accent-bar: #F3EE04; }
.setup .panel.acc-green { --accent-bar: #00A650; }
.setup input[type=text] { width: 100%; margin: var(--sp1) 0 var(--sp2); }
.seg { display: flex; gap: var(--sp2); margin: var(--sp2) 0 var(--sp3); }
.seg .btn { flex: 1; }
.setup details { margin-top: var(--sp1); }
.setup summary { cursor: pointer; font-weight: 800; }
.setup li { margin: var(--sp1) 0; }
.account-panel .account-row { display: flex; align-items: center; gap: var(--sp3); flex-wrap: wrap; }
.account-panel .account-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--btn-alt); border: 2px solid var(--border); }
.account-panel .account-fields { display: grid; gap: var(--sp2); }
.account-panel input[type=password], .account-panel input[type=text] { width: 100%; margin: 0; }
.account-panel .account-actions { display: flex; gap: var(--sp2); flex-wrap: wrap; margin-top: var(--sp2); }
.account-panel .account-preferences { display: grid; grid-template-columns: 1fr auto; gap: var(--sp2) var(--sp3); align-items: center; margin-top: var(--sp3); }
.account-panel .account-preferences input[type=range] { width: 120px; }
.account-panel .account-preferences label { display: contents; }
.account-status { min-height: 1.3em; margin: var(--sp2) 0 0; font-size: .9rem; font-weight: 700; }
@media (max-width: 420px) { .account-panel .account-preferences input[type=range] { width: 95px; } }
.social-list { display: grid; gap: var(--sp2); }
.social-row { display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; padding: var(--sp2); background: rgba(255,255,255,.55); border: 1px solid var(--border); border-radius: 6px; }
.social-avatar { width: 42px; height: 42px; flex: none; object-fit: cover; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.social-row .social-name { flex: 1 1 100px; font-weight: 800; overflow-wrap: anywhere; }
.board-editor-preview { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); grid-template-rows: repeat(11, minmax(0, 1fr)); gap: 2px; width: min(100%, 520px); aspect-ratio: 1; margin: var(--sp3) auto; padding: 5px; background: var(--wood-dark); border: 3px solid #1b1714; border-radius: 8px; }
.board-preview-space { min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 1px; background: #f8fbf7; color: #101a14; border: 1px solid #52645a; font: 700 clamp(5px, 1.4vw, 10px)/1.05 var(--font); text-align: center; overflow-wrap: anywhere; }
.board-preview-space.property { border-top: 4px solid var(--space-color, #888); }
button.board-preview-space { cursor: pointer; }
button.board-preview-space.selected { outline: 3px solid var(--accent); outline-offset: -3px; }
.board-preview-center { grid-row: 2 / 11; grid-column: 2 / 11; display: grid; place-items: center; padding: var(--sp3); background: var(--board); border: 1px solid var(--border); color: var(--fg); text-align: center; font-weight: 800; overflow-wrap: anywhere; }
.board-editor-controls { display: grid; gap: var(--sp2); max-width: 520px; margin: 0 auto; }
.social-actions { display: flex; gap: var(--sp2); flex-wrap: wrap; margin-left: auto; }

@media (min-width: 1100px) {
  .hud-pills { gap: var(--sp2); }
  .pill .avatar { width: 34px; height: 34px; font-size: 1rem; }
  .pill .pmoney { font-size: 1.15rem; }
}
</style>
</head>

/* MONEY_SCALE turns the classic board's toy numbers into prices closer to
   real Ontario dollars. Everything below (start cash, salary, jail fine,
   property prices, rents, house costs, taxes) is multiplied by this once,
   in the property()/railroad()/utility() builders and here. Raise or
   lower this one number to make the whole game richer or cheaper. */
const MONEY_SCALE = 1;

// below, before the full fmt() helper exists (fmt needs game state).
function fmtStatic(n) { return '$' + Math.round(n * MONEY_SCALE).toLocaleString('en-CA'); }

/* THE ONLINE RANDOMNESS SHIM
   Online play needs every screen to land on the exact same dice rolls
   and card draws, not just the same final money and property owners --
   AND it needs every screen to START that roll or draw at the same
   moment, not several seconds later. That second requirement is why
   this is no longer "run the whole turn for real, THEN send everyone
   the finished list of random numbers": waiting for the host's own
   animation to finish before a guest even hears about the action is
   exactly what caused guests to see rolls, moves and results several
   seconds behind the host.
   Instead, random numbers are now STREAMED one at a time, the instant
   each is generated, and the action itself (see hostRun in SECTION 15)
   is announced to every guest BEFORE the host starts running/animating
   it -- not after. Every guest then calls that exact same function
   (rollDice, drawCard, ...) itself, for real, at (almost) the same
   moment as the host, and its rnd() calls pull the streamed numbers
   out of a small queue as they arrive -- so the dice, the cards and
   every move come out identically, and start together, with only
   normal network latency (milliseconds) between screens instead of a
   whole animation's length (seconds).
     HOST:    rnd() makes a real random number, immediately streams it
              to every guest as a tiny {t:'rng'} message, and returns
              it right away. The host never waits on the network.
     GUEST:   rnd() pulls the next streamed number out of rngQueue. If
              it hasn't arrived yet (only genuine network lag can cause
              this -- never animation time, since the host sends it the
              moment it's generated, not when the animation finishes),
              it waits for it via rngWaiters instead of guessing, so a
              guest can NEVER end up on a different outcome than the
              host.

              random number.
   Every call site does `await rnd()` (see rollDie, drawCard, and the
   turn-order shuffle in beginGame). That await costs nothing for the
   host and for offline play; it only actually pauses on a guest, and
   only if the network is unusually slow. */

async function rnd() {

}
