   SECTION 7. ANIMATION HELPERS
   3D camera, dice, and pieces hopping square to square.
   ===================================================================== */

/* Turns a square number (0 to 39) into a grid row and column (1 to 11).
   Squares run around the outside edge: bottom row (right to left), left
   column (bottom to top), top row (left to right), right column (top to bottom). */
function gridPos(i) {
  if (i <= 10) return [11, 11 - i];
  if (i <= 20) return [11 - (i - 10), 1];
  if (i <= 30) return [1, 1 + (i - 20)];
  return [1 + (i - 30), 11];
}
// Middle of square i, as a percent of the board. The board is 12 units
// across: two corners of 1.5 and nine squares of 1.
function cellCenter(i) {
  const [r, c] = gridPos(i);
  const u = n => (n === 1 ? 0.75 : n === 11 ? 11.25 : n);
  return { x: u(c) / 12 * 100, y: u(r) / 12 * 100 };
}
// Which way should the text on square i face? (degrees)
function cellRot(i) {
  if (i % 10 === 0) return 0;      // corners stay upright
  if (i < 10) return 0;            // bottom row
  if (i < 20) return 90;           // left column
  if (i < 30) return 180;          // top row
  return 270;                      // right column
}
const sideOf = i => (i < 10 ? 'bottom' : i < 20 ? 'left' : i < 30 ? 'top' : 'right');

/* THE 3D CAMERA
   We do not move a camera. We move the table (the "plane") in front of a
   fixed viewer. The transform reads right to left:
     translate(...)  slide the table so the square we care about is centered
     rotateZ(yaw)    turn the table a little (the camera swings around)
     rotateX(tilt)   lay the table back so we look at it from an angle
     translateZ(...) push the table toward the viewer (zoom in)
     translateY(...) small nudge so the idle view sits in the middle
   The camera runs on a small physics-style loop (cameraTick, defined below)
   instead of one-shot CSS transitions, so a new target can interrupt the
   current motion at any time without snapping: the view just eases toward
   wherever it's currently being asked to go. That's what lets the player's
   manual zoom smoothly interrupt an automatic move, and lets the automatic
   move smoothly resume afterward.

   AUTO target (autoTarget): set by game events (cameraFocus / cameraReset)
     -- following a token, peeking a property, returning to the overview.
   MANUAL target: driven by the player's own zoom input (wheel, pinch,
     +/- buttons, the slider). While the player is actively zooming
     (manualActive), the manual target wins every frame; a short idle
     timeout hands control back to whatever the auto target currently is. */
const CAM = {
  tilt: { a: 42, base: 0.15, follow: 1.45, close: 1.85, manualMax: 2.6, shift: -0.045 },
  flat: { a: 0,  base: 0,    follow: 1.2,  close: 1.6,  manualMax: 2.2, shift: 0 },
};
const YAW = { bottom: 0, left: 7, top: 0, right: -7 };
// How far (deg) the plane must turn so a side's text reads horizontal once
// we're zoomed all the way in. Mirrors cellRot()'s per-side text rotation,
// negated (and folded to the short way round), since the camera's rotateZ
// and each cell's own rotate() stack additively in the plane's flat frame.
const ALIGN = { bottom: 0, left: -90, top: 180, right: 90, center: 0 };
const lerp = (a, b, t) => a + (b - a) * t;

// Which edge zone a raw board position (percent, 0..100) falls in -- same
// idea as sideOf()/cellRot() but continuous, so ANY point on the board
// (not just a property's own square) can be classified: the corners and
// the middle (logo/dice/cards) count as 'center' and stay upright.
// currentZone (optional) is the zone we're currently locked onto: its
// boundary is pushed out a little further before we'll count the point as
// having left it, so a point sitting right on a boundary line can't flicker
// between two zones from sub-pixel mouse jitter alone.
function zoneAt(xPct, yPct, currentZone) {
  const col = xPct / 100 * 12, row = yPct / 100 * 12;
  const M = 0.35;
  const bottomLine = 10.5 - (currentZone === 'bottom' ? M : 0);
  const topLine = 1.5 + (currentZone === 'top' ? M : 0);
  const leftLine = 1.5 + (currentZone === 'left' ? M : 0);
  const rightLine = 10.5 - (currentZone === 'right' ? M : 0);
  const nearBottom = row > bottomLine, nearTop = row < topLine;
  const nearLeft = col < leftLine, nearRight = col > rightLine;
  if ((nearBottom || nearTop) && (nearLeft || nearRight)) return 'center'; // corners
  if (nearBottom) return 'bottom';
  if (nearLeft) return 'left';
  if (nearTop) return 'top';
  if (nearRight) return 'right';
  return 'center';
}
// A camera "target": where to center (x,y percent), the subtle idle swing
// (yawBase, only while tilted), and the full-zoom reading rotation (alignYaw).
function squareTarget(sq) {
  const c = cellCenter(sq), side = sideOf(sq);
  return { x: c.x, y: c.y, yawBase: tiltOn ? YAW[side] : 0, alignYaw: sq % 10 === 0 ? 0 : ALIGN[side] };
}
function pointTarget(xPct, yPct) {
  const zone = zoneAt(xPct, yPct);
  return { x: xPct, y: yPct, yawBase: tiltOn ? (YAW[zone] || 0) : 0, alignYaw: ALIGN[zone] || 0 };
}

// A full camera pose aimed at a target {x,y,yawBase,alignYaw}, at closeness
// 0..1 (0 = normal board view, 1 = fully zoomed in AND rotated so whatever
// is being looked at reads horizontally). The rotation (yawBase easing to
// alignYaw) is what makes zooming in -- manual or automatic -- turn to face
// the text, wherever on the board that happens to be.
function poseFor(cfg, target, closeness, W) {
  const cl = Math.max(0, Math.min(1, closeness));
  // Panning toward the target eases in with closeness too (cl), same as the
  // zoom depth and the rotation -- so at cl=0 we're always dead centered on
  // the normal board view, and panning only kicks in as we actually zoom.
  return {
    dz: lerp(cfg.base, cfg.manualMax, cl) * W,
    a: lerp(cfg.a, cfg.a * 0.15, cl),
    yaw: lerp(target.yawBase, target.alignYaw, cl),
    tx: -(target.x / 100 * W - W / 2) * cl, ty: -(target.y / 100 * W - W / 2) * cl, sy: 0,
  };
}
function applyCameraStyle(s) {
  const plane = $('plane');
  if (!plane) return;
  plane.style.transitionDuration = '0ms'; // cameraTick drives every frame itself
  plane.style.transform = `translateY(${s.sy}px) translateZ(${s.dz}px) rotateX(${s.a}deg) rotateZ(${s.yaw}deg) translate(${s.tx}px, ${s.ty}px)`;
}

let autoTarget = { dz: 0, a: 0, yaw: 0, tx: 0, ty: 0, sy: 0, tau: 70 };
let camState   = { dz: 0, a: 0, yaw: 0, tx: 0, ty: 0, sy: 0 };
let manualZoom = 0;          // 0..1, the player's own zoom amount
let manualActive = false;    // true while manual zoom/pan is "in control" of the camera

/* CAMERA ORIENTATION STABILITY (while manually zoomed in)
   Which side/corner the camera is rotated to face is deliberately updated
   on its own slow schedule instead of every frame, so hovering near a
   boundary between two sides -- or ordinary mouse jitter -- can never make
   the camera flip back and forth. A different side only takes over once
   it's been asked for continuously for ORIENT_HOLD_MS: long enough to read
   as the player having genuinely moved their attention, not noise. Panning
   (where the camera centers) still tracks the player's input live -- only
   the rotation is held stable this way. */
let orientZone = null;          // the side/corner the camera is currently aligned to
let orientCandidate = null;     // a different side being asked for, not yet committed
let orientCandidateSince = 0;   // timestamp that candidate first appeared
const ORIENT_HOLD_MS = 5000;    // how long a new side must be held before the camera turns to it

// The side/corner manual zoom/pan is currently pointed at, before any
// stability filtering -- same sources manualFocusTarget() draws position from.
function rawOrientZone() {
  if (manualPoint) return zoneAt(manualPoint.x, manualPoint.y, orientZone);
  if (ui.manage && ui.manage.focused != null) return sideOf(ui.manage.focused);
  if (game) { try { return sideOf(cur().pos); } catch (e) { /* no current player yet */ } }
  return 'bottom';
}
// Advances the committed orientation zone toward whatever's currently being
// asked for, but only after that request has held steady for ORIENT_HOLD_MS.
// Called once per frame while manual zoom is active; a no-op whenever
// nothing has actually changed.
function settleOrientZone(now) {
  const raw = rawOrientZone();
  if (orientZone === null) { orientZone = raw; orientCandidate = null; return; }
  if (raw === orientZone) { orientCandidate = null; return; }
  if (orientCandidate !== raw) { orientCandidate = raw; orientCandidateSince = now; return; }
  if (now - orientCandidateSince >= ORIENT_HOLD_MS) { orientZone = raw; orientCandidate = null; }
}

/* CAMERA CONTROL PRECEDENCE
   Manual zoom/pan, once started, owns the camera until the player zooms
   all the way back out -- there is no idle timeout, nothing hands it back
   automatically. The one exception, per spec, is player movement: rolling
   and hopping around the board is allowed to take the camera over (to show
   the dice and follow the token), but even then only until the player
   touches zoom/pan themselves, at which point their input immediately wins
   and stays in control. Everything else (peeking a square, opening Manage,
   closing a dialog, toggling a view) is "soft" -- it updates where the
   camera would go, but never yanks it away from an active manual view. */
let movementInProgress = false; // true for the whole roll -> hop -> land sequence
let moveOverridden = false;     // true once the player manually zooms/pans during that sequence
let preMoveSnapshot = null;     // manual view (if any) to resume once the sequence ends

// Soft camera cues: peek, manage, dialogs, view toggles. These only ever
// change where the camera WOULD be if nothing else is in control -- they
// never flip manualActive, so an active manual view is left completely alone.
function cameraFocus(sq, ms, mode) {
  if (!cameraOn || reduceMotion || !$('plane')) return;
  const cfg = tiltOn ? CAM.tilt : CAM.flat, W = $('plane').offsetWidth;
  // 'close' (property peek) is fully zoomed + aligned; 'follow' (token hopping)
  // is a partial, proportional zoom -- the same alignment math as manual zoom uses.
  const closeness = mode === 'close' ? 1 : (cfg.follow - cfg.base) / (cfg.close - cfg.base);
  autoTarget = { ...poseFor(cfg, squareTarget(sq), closeness, W), tau: Math.max(ms, 40) / 3 };
}
function cameraReset(ms) {
  if (!$('plane')) return;
  const cfg = tiltOn ? CAM.tilt : CAM.flat, W = $('plane').offsetWidth;
  autoTarget = { dz: cfg.base * W, a: cfg.a, yaw: 0, tx: 0, ty: 0, sy: cfg.shift * W, tau: Math.max(ms === undefined ? T(700) : ms, 40) / 3 };
}

// Movement's own camera cues: these are the ONLY calls allowed to grab the
// camera away from an active manual view -- and only while the player
// hasn't manually intervened yet this move (see beginMovementCamera below).
function moveCameraFocus(sq, ms, mode) { if (moveOverridden) return; manualActive = false; manualPoint = null; cameraFocus(sq, ms, mode); }
function moveCameraReset(ms) { if (moveOverridden) return; manualActive = false; manualPoint = null; cameraReset(ms); }
// Call once, right as a roll/move sequence begins: remembers the player's
// manual view (if they had one) so it can be restored afterward, unmoved.
function beginMovementCamera() {
  preMoveSnapshot = manualActive ? { point: manualPoint ? { x: manualPoint.x, y: manualPoint.y } : null, zoom: manualZoom } : null;
  movementInProgress = true;
  moveOverridden = false;
}
// Call once, right as the sequence ends. If the player never touched
// zoom/pan during the move, resume exactly what was showing before (their
// manual view, or the normal board view). If they did take the wheel
// during the move, their resulting view IS the current state -- leave it.
function finishMovementCamera(ms) {
  movementInProgress = false;
  if (!moveOverridden) {
    if (preMoveSnapshot) {
      manualPoint = preMoveSnapshot.point; manualZoom = preMoveSnapshot.zoom; manualActive = true;
      orientZone = null; orientCandidate = null; // resuming a manual view: frame it fresh
    } else {
      cameraReset(ms);
    }
  }
  preMoveSnapshot = null;
}

// Manual zoom's own aim point: a free {x,y} percent on the board, set by
// wheel/pinch/drag so the player can zoom into and pan around anywhere --
// properties, corners, cards, empty spaces, all of it -- not just the
// current property/token. Cleared (falls back to whatever's peeked/managed,
// else the current player's token, else GO) when zoom is driven by the
// slider/buttons instead, which have no on-board position of their own.
// Manual zoom/pan (wheel, pinch, drag, +/- buttons and the slider) has been
// removed -- the player no longer has a way to set manualActive/manualZoom,
// so the camera is always the automatic one (follow, peek, manage, reset).
// manualPoint/manualActive/manualZoom and manualFocusTarget are left in
// place since cameraTick, the movement-camera snapshot logic, and the
// orientation helpers above still reference them; they simply never turn on.
let manualPoint = null;
function manualFocusTarget() {
  const zone = orientZone || rawOrientZone();
  const rot = { yawBase: tiltOn ? (YAW[zone] || 0) : 0, alignYaw: ALIGN[zone] || 0 };
  if (manualPoint) return { x: manualPoint.x, y: manualPoint.y, ...rot };
  if (ui.manage && ui.manage.focused != null) { const c = cellCenter(ui.manage.focused); return { x: c.x, y: c.y, ...rot }; }
  if (game) { try { const c = cellCenter(cur().pos); return { x: c.x, y: c.y, ...rot }; } catch (e) { /* no current player yet */ } }
  const c = cellCenter(0);
  return { x: c.x, y: c.y, ...rot };
}

// The camera's per-frame loop: eases camState toward whichever target is
// currently in control (manual while the player owns the wheel, auto
// otherwise), using time-based exponential smoothing so it never snaps and
// so a change of target mid-flight blends in rather than jumping.
//
// Once it actually arrives, this STOPS writing the transform every frame.
// The exponential ease never mathematically reaches its target, so
// without this the board's transform was being reassigned 60 times a
// second forever, even sitting still fully zoomed in (e.g. in Manage
// properties). A transform that never stops changing never gets treated
// as idle, so the browser keeps it on a cheap, blurry raster instead of
// redrawing the zoomed-in board sharply. Snapping the last tiny gap away
// and then leaving the transform alone gives the browser that idle
// moment, so text and squares turn crisp again while zoomed in or after
// a move finishes, with no visible jump since the gap snapped away is
// far smaller than a pixel.
let camLastT = 0;
let camSettled = false;
function cameraTick(t) {
  const plane = $('plane');
  if (plane) {
    const cfg = tiltOn ? CAM.tilt : CAM.flat, W = plane.offsetWidth || 1;
    if (manualActive) settleOrientZone(t);
    const target = manualActive ? poseFor(cfg, manualFocusTarget(), manualZoom, W) : autoTarget;
    const tau = manualActive ? 90 : (autoTarget.tau || 200);
    const dt = camLastT ? Math.min(t - camLastT, 64) : 16;
    const alpha = 1 - Math.exp(-dt / Math.max(tau, 16));
    const next = {
      dz: lerp(camState.dz, target.dz, alpha), a: lerp(camState.a, target.a, alpha),
      yaw: lerp(camState.yaw, target.yaw, alpha), tx: lerp(camState.tx, target.tx, alpha),
      ty: lerp(camState.ty, target.ty, alpha), sy: lerp(camState.sy, target.sy, alpha),
    };
    const near = (a, b, tol) => Math.abs(a - b) < tol;
    const posTol = Math.max(W * 0.0006, 0.05);
    const arrived = near(next.dz, target.dz, posTol) && near(next.tx, target.tx, posTol) && near(next.ty, target.ty, posTol) &&
      near(next.sy, target.sy, posTol) && near(next.a, target.a, 0.02) && near(next.yaw, target.yaw, 0.02);
    if (arrived) {
      if (!camSettled) { camState = { ...target }; applyCameraStyle(camState); camSettled = true; }
      // else: already settled and unchanged, skip the write entirely
    } else {
      camState = next; applyCameraStyle(camState); camSettled = false;
    }
  }
  camLastT = t;
  requestAnimationFrame(cameraTick);
}
requestAnimationFrame(cameraTick);



/* THE DICE
   Each die is a real 3D cube with six faces. Opposite faces add to 7.
   To show a number, we turn the cube so that face points at the viewer.
   FACE_ROT lists [rotateX, rotateY] for each number. */
const PIPS = { 0: [], 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
const FACE_ROT = { 1: [0, 0], 6: [0, 180], 3: [0, -90], 4: [0, 90], 2: [-90, 0], 5: [90, 0] };
function dieHTML(v) {
  let h = '';
  for (let k = 1; k <= 9; k++) h += `<span class="pip ${PIPS[v].includes(k) ? 'on' : ''}"></span>`;
  return h;
}
function cubeHTML(id) {
  const f = (cls, v) => `<div class="face ${cls}">${dieHTML(v)}</div>`;
  return `<div class="die3d"><div class="cube" id="${id}">
    ${f('f-front', 1)}${f('f-back', 6)}${f('f-right', 3)}${f('f-left', 4)}${f('f-top', 2)}${f('f-bottom', 5)}
  </div></div>`;
}
// Final resting pose for a value. "spin" adds whole turns for the tumble.
function dicePose(v, spin) {
  if (!v) return 'rotateX(-26deg) rotateY(30deg) rotateZ(0deg)';
  const [x, y] = FACE_ROT[v];
  const sx = spin ? 360 * (1 + Math.floor(Math.random() * 2)) : 0, sy = spin ? 360 * (1 + Math.floor(Math.random() * 2)) : 0;
  const jitter = spin ? spin : 0;
  return `rotateX(${x - 14 + sx}deg) rotateY(${y + 14 + sy}deg) rotateZ(${jitter}deg)`;
}
function setDice(a, b) {
  const c0 = $('cube0'), c1 = $('cube1');
  if (c0) c0.style.transform = dicePose(a, 0);
  if (c1) c1.style.transform = dicePose(b, 0);
}
// Throw the dice onto the board, tumble, and land on the real numbers.
async function animateDice(a, b) {
  const c = [$('cube0'), $('cube1')], vals = [a, b];
  const dur = T(1000);
  const canAnimate = !reduceMotion && c[0] && typeof c[0].animate === 'function';
  if (!canAnimate) { setDice(a, b); await sleep(T(200)); return; }
  const jit = [Math.round(Math.random() * 24 - 12) || 5, Math.round(Math.random() * 24 - 12) || -5];
  c.forEach((el, i) => {
    // the tumble: same list of rotations start to end, so it spins the long way
    const end = dicePose(vals[i], jit[i]);
    el.animate([{ transform: 'rotateX(0deg) rotateY(0deg) rotateZ(0deg)' }, { transform: end }],
      { duration: dur * (i ? 0.92 : 1), easing: 'cubic-bezier(.15,.6,.3,1)', fill: 'forwards' });
    el.dataset.rest = dicePose(vals[i], jit[i]).replace(/rotateX\((-?\d+)deg\)/, (m, n) => `rotateX(${((+n % 360) + 360) % 360}deg)`);
  });
  // the throw: dice fly in from the edge, land, hop once, settle
  $('dice').animate([
    { transform: 'translate(-160%, -170%) scale(1.5)', offset: 0 },
    { transform: 'translate(0, 0) scale(1.12)', offset: 0.55 },
    { transform: 'translate(4%, -16%) scale(1.06)', offset: 0.7 },
    { transform: 'translate(0, 0) scale(1)', offset: 0.86 },
    { transform: 'translate(0, -4%) scale(1)', offset: 0.94 },
    { transform: 'translate(0, 0) scale(1)', offset: 1 },
  ], { duration: dur, easing: 'ease-out' });
  playDiceSound();
  await sleep(dur - 120);
  await sleep(160);
  c.forEach((el, i) => {
    el.style.transform = dicePose(vals[i], jit[i]);
    if (el.getAnimations) el.getAnimations().forEach(x => x.cancel());
  });
  await sleep(T(250));
}

// Pieces. Tokens are permanent elements, so changing left/top makes
// them slide (see .tk in the CSS).
function initTokens() {
  $('tokens').innerHTML = game.players.map(p =>
    `<div class="tk" id="tk${p.id}" style="--pc:${p.color}"><div class="tk-dot">${p.id + 1}</div></div>`).join('');
}
function updateTokens() {
  const groups = {};
  game.players.forEach(p => { if (!p.bankrupt) (groups[tokenPos[p.id]] = groups[tokenPos[p.id]] || []).push(p); });
  // While Manage properties is zoomed in on a square, a token standing
  // there sits right on top of the deed text. Fade out any token on the
  // square currently being examined so it doesn't block the view.
  const hideSq = ui.manage ? manageSquare() : -1;
  game.players.forEach(p => {
    const el = $('tk' + p.id);
    if (!el) return;
    if (p.bankrupt) { el.style.display = 'none'; return; }
    el.style.display = '';
    const grp = groups[tokenPos[p.id]], n = grp.length, k = grp.indexOf(p);
    const c = cellCenter(tokenPos[p.id]);
    let dx = 0, dy = 0;
    if (n > 1) { const r = n > 4 ? 2.7 : 1.7; const ang = (k / n) * Math.PI * 2 - Math.PI / 2; dx = Math.cos(ang) * r; dy = Math.sin(ang) * r; }
    el.style.left = (c.x + dx) + '%'; el.style.top = (c.y + dy) + '%';
    el.style.opacity = (tokenPos[p.id] === hideSq) ? '0' : '1';
    el.classList.toggle('active', p.id === cur().id && !game.over);
  });
}
function hop(id, ms) {
  const el = document.querySelector('#tk' + id + ' .tk-dot');
  if (el && el.animate && !reduceMotion) {
    el.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-75%) scale(1.2)', offset: .5 }, { transform: 'translateY(0) scale(1)' }],
      { duration: ms, easing: 'ease-out' });
  }
}

/* Movement. Time per step shrinks for long trips so they stay quick. */
function stepTime(n) { return T(Math.max(70, Math.min(230, Math.round(2600 / Math.max(n, 1))))); }
async function stepTo(playerId, direction, ms) {
  const result = applyGameAction({ type: 'MOVE_STEP', playerId, direction });
  if (!result) return [];
  const player = game.players[playerId], position = player.pos;
  $('tokens').style.setProperty('--step', ms + 'ms');
  tokenPos[player.id] = position;
  updateTokens(); hop(player.id, ms); sfx.step(); moveCameraFocus(position, ms, 'follow');
  await sleep(ms);
  return result.events;
}
async function moveForward(p, steps) {
  const playerId = p.id;
  const ms = stepTime(steps);
  moveCameraFocus(game.players[playerId].pos, T(400), 'follow');
  await sleep(T(200));
  for (let i = 0; i < steps; i++) {
    const events = await stepTo(playerId, 1, ms);
    if (events.some(event => event.type === 'GO_SALARY_COLLECTED')) {
      log(`${p.name} passes GO and collects ${fmt(GO_SALARY)}.`);
      render();
    }
  }
}
async function moveBackward(p, steps) {
  const playerId = p.id;
  const ms = stepTime(steps);
  for (let i = 0; i < steps; i++) await stepTo(playerId, -1, ms);
}
async function moveToSquare(p, target) {
  const steps = (target - game.players[p.id].pos + BOARD_SIZE) % BOARD_SIZE;
  if (steps > 0) await moveForward(p, steps);
}
// Jail: the piece slides straight across the board.
async function sendToJail(p) {
  if (!applyGameAction({ type: 'SEND_TO_JAIL', playerId: p.id })) return;
  await animateJail(p.id);
}
async function animateJail(playerId) {
  sfx.jail();
  $('tokens').style.setProperty('--step', T(700) + 'ms');
  tokenPos[playerId] = JAIL_POS;
  updateTokens(); moveCameraFocus(JAIL_POS, T(700), 'follow');
  await sleep(T(800));
}

/* Card popup. Returns a promise that finishes when the player clicks OK,
   so the game waits for the card to be read.

   This used to store the pending resolver in a single module-level
   variable (popupResolve). That is what caused Chance/Community Chest to
   desync: on a guest, this whole drawCard()->showCard() call is itself
   running INSIDE the strictly-ordered replay queue (see guestReplay/
   pumpReplay below), and the only thing that can resolve it is the
   *next* queued message ({t:'run', name:'closeCard'}). But the queue
   will not even look at that next message until the current one
   finishes -- and the current one can't finish until closeCard() runs.
   That is a deadlock: every guest would freeze on the card forever, no
   matter how fast anyone clicked OK.

   The fix is two-fold (see closeCard(), and joinHandleData() below):
     1. Every card gets a stable id, carried on `game` itself
        (game.cardSeq) so it survives a guest reconnecting mid-card via a
        sync snapshot, not on a client-local counter that could drift.
     2. A "close" signal for that id is recorded (cardCloseFlags) the
        instant it arrives, independent of whether this browser's own
        showCard() call for that id has even started waiting yet. If the
        close signal shows up first, showCard() sees the flag and
        resolves immediately instead of waiting for a resolver that
        will never be delivered through the normal queue.
   Combined with delivering that signal OUT of band (bypassing the
   ordered replay queue entirely -- it needs to reach every browser
   immediately, precisely because normal delivery is what deadlocks),
   this makes card close correct regardless of network timing, replay
   lag, or who clicks OK. */
const cardCloseFlags = Object.create(null);     // id -> true, once a close signal has arrived (even before showCard() asked for it)
const cardCloseWaiters = Object.create(null);   // id -> resolve fn, while showCard() is actively waiting on that id
function showCard(label, text) {
  sfx.card();
  const id = ++game.cardSeq;
  popup = { label, text, id };
  render();
  if (cardCloseFlags[id]) { delete cardCloseFlags[id]; return Promise.resolve(); }
  return new Promise(res => { cardCloseWaiters[id] = res; });
}
function closeCard(id) {
  if (id == null) id = popup ? popup.id : null;
  if (id == null) return;
  if (popup && popup.id === id) { popup = null; render(); }
  const res = cardCloseWaiters[id];
  if (res) { delete cardCloseWaiters[id]; res(); }
  else cardCloseFlags[id] = true;   // showCard() for this id hasn't run yet on this browser -- remember it arrived
}

/* =====================================================================
   SECTION 8. TURN FLOW
   rollDice -> (move) -> land -> buy / skip (auction) -> finishAction -> endTurn
   Most steps are "async" because they wait for animations.
   ===================================================================== */
async function rollDice() {
  if (busy || game.over || game.phase !== 'roll' || ui.manage) return;

  if (isBackendAuthoritativeGame()) return submitAuthoritativeRoll();

  // Clear only an abandoned DRAFT of the current player's own trade (never
  // sent). A trade that has already been sent -- or postponed -- belongs to
  // its sender/receiver, not to whoever's turn it happens to be, and must
  // keep living independently of the turn (see endTurn and the trade timer).
  busy = true;
  if (game.trade && ['pick', 'edit'].includes(game.trade.stage)) game.trade = null;
  render();
  beginMovementCamera();
  moveCameraReset(T(400));
  try { $('scene').scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); } catch (e) {}
  const p = cur(), wasInJail = p.inJail;
  const a = await rollDie(), b = await rollDie(), isDouble = a === b;
  await animateDice(a, b);
  const result = applyGameAction({ type: 'ROLL_DICE', playerId: p.id, dice: [a, b] });
  if (!result) { busy = false; finishMovementCamera(T(600)); render(); return; }
  const rolled = result.events.find(event => event.type === 'DICE_ROLLED');
  const active = game.players[p.id];
  log(`${p.name} rolled ${a} + ${b}${isDouble ? ' (doubles)' : ''}.`);

  if (wasInJail) {
    if (isDouble) {                              // doubles free you, no extra roll
      log(`${p.name} rolled doubles and leaves jail.`);
      await doMove(active, a + b);
    } else if (result.events.some(event => event.type === 'JAIL_FINE_DUE')) {
      log(`${p.name} pays ${fmt(JAIL_FINE)} after 3 tries.`);
      presentPaymentEvents(result.events);
      if (result.events.some(event => event.type === 'MOVE_REQUESTED')) await doMove(game.players[p.id], a + b);
    } else if (result.events.some(event => event.type === 'JAIL_ROLL_FAILED')) {
      log(`No doubles. ${p.name} stays in jail.`);
    }
  } else if (result.events.some(event => event.type === 'THREE_DOUBLES_JAIL')) {
      log(`Three doubles in a row. ${p.name} goes to jail.`);
      await sendToJail(game.players[p.id]);
  } else if (rolled && result.events.some(event => event.type === 'MOVE_REQUESTED')) {
    await doMove(active, a + b);
  }
  endOfMovePipeline();
}

function backendRollIsLegal() {
  const sync = window.authoritativeGame;
  const state = sync && sync.state;
  if (!isBackendAuthoritativeGame() || !accountUser || !state || state.over || state.paused) return false;
  const player = state.players.find(candidate => candidate.accountId === accountUser.id);
  const current = state.players[state.turnOrder[state.current]];
  return !!player && !!current && current.id === player.id &&
    MonopolyGameEngine.legalActions(state, SPACES).some(action => action.type === 'ROLL_DICE' && action.playerId === player.id);
}

async function submitAuthoritativeRoll() {
  if (authoritativeRollInFlight || !backendRollIsLegal()) return;
  const sync = window.authoritativeGame;
  if (!authoritativeRollRequest || authoritativeRollRequest.gameId !== sync.gameId) {
    authoritativeRollRequest = {
      gameId: sync.gameId,
      expectedVersion: sync.version,
      requestId: sync.createRequestId(),
    };
  }

  authoritativeRollInFlight = true;
  busy = true;
  ui.notice = '';
  render();
  try {
    await sync.submitGameAction({
      gameId: authoritativeRollRequest.gameId,
      expectedVersion: authoritativeRollRequest.expectedVersion,
      requestId: authoritativeRollRequest.requestId,
      action: { type: 'ROLL_DICE' },
    });
    authoritativeRollRequest = null;
  } catch (error) {
    if (error.code === 'STALE_VERSION') {
      authoritativeRollRequest = null;
      ui.notice = 'The game changed. Check the current turn before rolling again.';
    } else if (error.code === 'NOT_YOUR_TURN') {
      authoritativeRollRequest = null;
      ui.notice = 'It is not your turn to roll.';
    } else if (error.code === 'NETWORK_ERROR' || error.status >= 500) {
      authoritativeRollRequest = {
        gameId: sync.gameId,
        expectedVersion: error.expectedVersion || authoritativeRollRequest.expectedVersion,
        requestId: error.requestId || authoritativeRollRequest.requestId,
      };
      ui.notice = 'The server connection failed. Retry Roll to safely check this same request.';
    } else {
      authoritativeRollRequest = null;
      ui.notice = error.message || 'The roll could not be submitted.';
    }
  } finally {
    authoritativeRollInFlight = false;
    busy = false;
    finishMovementCamera(T(600));
    render();
  }
}

// Runs after any move finishes: unlock buttons, zoom out, continue.
function endOfMovePipeline() {
  busy = false;
  finishMovementCamera(T(600));
  // The 75-second trade/action timer starts the moment control comes back
  // to the current player after their roll and move resolve -- whichever
  // phase (buy/debt/after) they land in. See gameTick() for the countdown.
  startTradeTimer();
  if (game.phase === 'buy' || game.phase === 'debt' || game.phase === 'auction') render();
  else finishAction();
}
function startTradeTimer(now = Date.now()) {
  if (!game || game.over) return;
  applyGameAction({ type: 'START_TRADE_TIMER', now, durationMs: TRADE_TIMER_MS });
}

async function doMove(p, steps) {
  await moveForward(p, steps);
  p = game.players[p.id];
  log(`${p.name} lands on ${spaceLabel(p.pos)}.`);
  render();
  await sleep(T(300));
  await land(p);
}

// Decide what happens on the square the player is standing on.
async function land(p) {
  const position = p.pos, label = spaceLabel(position);
  const result = applyGameAction({ type: 'LAND_ON_SPACE', playerId: p.id, position });
  if (!result) return;
  for (const event of result.events) {
    switch (event.type) {
      case 'PROPERTY_AVAILABLE':
        log(`${label} is for sale at ${fmt(event.amount)}.`);
        break;
      case 'NO_RENT_MORTGAGED':
        log(`${label} is mortgaged. No rent.`);
        break;
      case 'RENT_DUE': {
        const owner = game.players[event.ownerId];
        log(`${p.name} owes ${owner.name} ${fmt(event.amount)} rent.`);
        break;
      }
      case 'LANDING_OWN_PROPERTY':
        log(`${p.name} owns this one already.`);
        break;
      case 'TAX_DUE':
        log(`${p.name} pays ${fmt(event.amount)} in tax.`);
        break;
      case 'LANDING_GO_TO_JAIL':
        log(`${p.name} goes to jail.`);
        await sendToJail(game.players[p.id]);
        break;
      case 'CARD_DRAW_REQUESTED':
        await drawCard(game.players[p.id], event.deck === 'chance' ? CHANCE_CARDS : CHEST_CARDS,
          event.deck === 'chance' ? 'Chance' : 'Community Chest');
        break;
    }
  }
  presentPaymentEvents(result.events);
}

async function drawCard(p, deck, label) {
  const card = deck[Math.floor(await rnd() * deck.length)];
  log(`${label}: ${card.text}`);
  await showCard(label, card.text);
  const result = applyGameAction({ type: 'APPLY_CARD', playerId: p.id, card });
  if (!result) return;
  presentPaymentEvents(result.events);
  for (const event of result.events) {
    if (event.type === 'CARD_MOVEMENT_REQUESTED') {
      const active = game.players[event.playerId];
      if (event.direction > 0) await moveToSquare(active, event.target);
      else await moveBackward(active, event.steps);
      const landed = game.players[event.playerId];
      log(`${landed.name} lands on ${spaceLabel(landed.pos)}.`);
      await land(landed);
    } else if (event.type === 'PLAYER_JAILED') {
      await animateJail(event.playerId);
    }
  }
}

function buyProperty() {
  const p = cur(), s = SPACES[p.pos];
  if (busy) return;
  const result = applyGameAction({ type: 'BUY_PROPERTY', playerId: p.id, position: p.pos });
  if (!result) return;
  log(`${p.name} bought ${spaceLabel(p.pos)} for ${fmt(s.price)}.`);
  if (result.events.some(event => event.type === 'DOUBLES_AGAIN')) log('Doubles. Roll again.');
  render();
}
function skipBuy() {
  if (busy || game.phase !== 'buy') return;
  const p = cur();
  const result = applyGameAction({ type: 'DECLINE_PROPERTY', playerId: p.id, position: p.pos });
  if (!result) return;
  log(`${p.name} passed on ${spaceLabel(p.pos)}. Auction time.`);
  render();
}
function payJailFine() {
  const p = cur();
  if (busy) return;
  if (!applyGameAction({ type: 'PAY_JAIL_FINE', playerId: p.id })) return;
  log(`${p.name} paid ${fmt(JAIL_FINE)} and leaves jail.`);
  render();
}

// After everything resolves: roll again (doubles) or wait for End turn.
function finishAction() {
  const result = applyGameAction({ type: 'COMPLETE_ACTION' });
  if (!result) return;
  if (result.events.some(event => event.type === 'DOUBLES_AGAIN')) log('Doubles. Roll again.');
  if (result.events.some(event => event.type === 'TURN_CHANGED')) log(`${cur().name}'s turn.`);
  render();
}
function endTurnClick() { if (!busy && game.phase === 'after' && !ui.manage) endTurn(); }
function endTurn() {
  const result = applyGameAction({ type: 'END_TURN' });
  if (!result) { render(); return; }
  log(`${cur().name}'s turn.`);
  render();
}

/* ---- Host pause: freezes the whole game state for everyone ---- */
function hostSetPause(paused, now = Date.now()) {
  if (!game || game.over) return;
  paused = !!paused;
  if (paused === !!game.paused) return;
  if (!applyGameAction({ type: 'SET_PAUSE', paused, now })) return;
  log(paused ? 'The host paused the game.' : 'The host resumed the game.');
  render();
}

/* ---- The authoritative "tick": expires the trade timer and the View
   Trade window on wall-clock time. Run only by the host (or, offline, by
   the single local browser) on a 1-second interval -- see startGameTick.
   Broadcast like any other action, so every guest reaches the same
   result at (almost) the same moment; the 'final' snapshot behind it
   heals any tiny clock drift, exactly as with every other action. ---- */
function gameTick(now = Date.now()) {
  if (!game || game.over || game.paused) return;
  const phase = game.phase;
  const result = applyGameAction({ type: 'GAME_TICK', now, blocked: busy || !!popup });
  if (!result) return;
  if (result.events.some(event => event.type === 'ACTION_TIMER_EXPIRED') && !busy && !popup && phase === 'buy') {
    log(`${cur().name} ran out of time to decide. Auction time.`);
  }
  if (result.events.some(event => event.type === 'TURN_CHANGED')) log(`${cur().name}'s turn.`);
  render();
}
let gameTickInterval = null;
function startGameTick() {
  if (gameTickInterval) return;
  gameTickInterval = setInterval(() => {
    if (!game) return;

    // Countdown text is presentation-only and stays smooth on every client.
    if (!game.paused && (game.tradeTimerEnd || game.viewTrade)) updateDock();
    if (game.over || game.paused) return;

    const now = Date.now();
    const timerDue = !!(game.tradeTimerEnd && now >= game.tradeTimerEnd);
    const viewDue = !!(game.viewTrade && now >= game.viewTrade.expiresAt);
    if (!timerDue && !viewDue) return;

    if (isBackendAuthoritativeGame()) {
      // Server multiplayer never falls through to the old PeerJS host path.
      // The authenticated host asks the server to process an expired timer;
      // the server supplies its own timestamp and re-checks the game state.
      if (backendIsHostOfCurrentGame() && !authoritativeActionInFlight) {
        submitAuthoritativeGameplayAction('gameTick', { type: 'GAME_TICK' });
      }
      return;
    }

    if (net.role === 'guest') return;
    hostRun('gameTick', [now], 0);
  }, 500);
}
function stopGameTick() { if (gameTickInterval) { clearInterval(gameTickInterval); gameTickInterval = null; } }

/* =====================================================================
  SECTION 9. MONEY PROBLEMS
  Payment and bankruptcy rules run in the engine. The functions here
  present debt decisions and engine events:
     - the player whose turn it is gets a DEBT phase. They can mortgage
       and sell houses by hand, then press Pay, or go bankrupt.
     - anyone else is raised cash automatically (houses first, then
       mortgages), or goes bankrupt if that is still not enough.
   Returns true if the payment was made.
   ===================================================================== */
function presentPaymentEvents(events) {
  for (const event of events) {
    const p = game.players[event.playerId];
    if (event.type === 'HOUSE_FORCED_SOLD') log(`${p.name} was forced to sell a house on ${spaceLabel(event.position)}.`);
    if (event.type === 'PROPERTY_FORCED_MORTGAGED') log(`${p.name} was forced to mortgage ${spaceLabel(event.position)}.`);
    if (event.type === 'DEBT_CREATED') log(`${p.name} owes ${fmt(event.amount)} but has ${fmt(p.money)}. Raise cash by mortgaging or selling houses.`);
    if (event.type === 'PLAYER_BANKRUPT') {
      const recipient = event.creditorId == null ? null : game.players[event.creditorId];
      log(`${p.name} is bankrupt${recipient ? ' and hands everything to ' + recipient.name : ''}.`);
    }
    if (event.type === 'GAME_WON') log(`${p.name} wins the game.`);
  }
}
function payDebt() {
  const d = game.debt;
  if (busy || !d) return;
  const p = game.players[d.pid];
  if (p.money < d.amount) return;
  ui.manage = null; cameraReset();
  const result = applyGameAction({ type: 'PAY_DEBT', playerId: p.id });
  if (!result) return;
  log(`${p.name} paid the ${fmt(d.amount)} debt.`);
  if (result.events.some(event => event.type === 'DOUBLES_AGAIN')) log('Doubles. Roll again.');
  if (result.events.some(event => event.type === 'TURN_CHANGED')) log(`${cur().name}'s turn.`);
  render();
}
function declareBankruptcy() {
  const d = game.debt;
  if (busy || !d) return;
  if (!game.confirmBankrupt) {
    if (applyGameAction({ type: 'CONFIRM_BANKRUPTCY', playerId: d.pid })) render();
    return;
  }
  ui.manage = null; cameraReset();
  const p = game.players[d.pid];
  const result = applyGameAction({ type: 'CONFIRM_BANKRUPTCY', playerId: d.pid });
  if (!result) return;
  presentPaymentEvents(result.events);
  if (result.events.some(event => event.type === 'DOUBLES_AGAIN')) log('Doubles. Roll again.');
  if (result.events.some(event => event.type === 'TURN_CHANGED')) log(`${cur().name}'s turn.`);
  render();
}

/* =====================================================================
   SECTION 10. AUCTIONS
   When a player skips buying, everyone bids in turn.
     - Each bidder can raise the bid or fold.
     - A folded player is out of this auction.
     - The auction ends when only the top bidder is left.
     - If everybody folds with no bids, the square stays with the bank.
   ===================================================================== */
function startAuction(pos) {
  if (!applyGameAction({ type: 'START_AUCTION', playerId: cur().id, position: pos })) return;
  render();
}
function auctionBid(amount) {
  const a = game.auction;
  if (!a) return;
  const p = game.players[a.turn];
  amount = Math.floor(Number(amount));
  const result = applyGameAction({ type: 'AUCTION_BID', playerId: p.id, amount });
  if (!result) return;
  log(`${p.name} bids ${fmt(amount)} for ${spaceLabel(a.pos)}.`);
  logAuctionResult(result.events);
  render();
}
function auctionFold() {
  const a = game.auction;
  if (!a) return;
  const folded = game.players[a.turn];
  const result = applyGameAction({ type: 'AUCTION_FOLD', playerId: folded.id });
  if (!result) return;
  log(`${folded.name} folds.`);
  logAuctionResult(result.events);
  render();
}
function logAuctionResult(events) {
  const ended = events.find(event => event.type === 'AUCTION_ENDED');
  if (!ended) return;
  if (ended.winnerId === null) log(`Nobody bid. ${spaceLabel(ended.position)} stays with the bank.`);
  else log(`${game.players[ended.winnerId].name} won ${spaceLabel(ended.position)} for ${fmt(ended.amount)}.`);
}

/* =====================================================================
   SECTION 11. TRADING
   The player whose turn it is picks a partner, then builds an offer:
   cash and properties in both directions. The partner accepts or declines.
   Rules:
     - a color set with houses cannot be traded (sell the houses first)
     - if a mortgaged square changes hands, the new owner pays the bank
       a 10 percent fee right away
   game.trade = { from, to, giveCash, getCash, give:[squares], get:[squares],
                  stage: 'pick' | 'edit' | 'review', error }
   ===================================================================== */
function tradable(pos, pid) {
  return MonopolyGameEngine.isTradable(game, SPACES, pos, pid);
}
const mortgageFee = pos => Math.ceil(mortgageValue(pos) * MORTGAGE_INTEREST);
function openTrade() {
  if (!canManage() || game.trade || ui.manage) return;
  const me = cur();
  if (isBackendAuthoritativeGame() && !backendPlayerMine(me.id)) return;
  if (!game.players.some(q => q.id !== me.id && !q.bankrupt)) return;
  ui.reviewingTrade = false;
  game.trade = { from: me.id, to: null, giveCash: 0, getCash: 0, give: [], get: [], stage: 'pick', error: '' };
  render();
}
function openTradeReview() { ui.reviewingTrade = true; render(); }
function closeTradeReview() { ui.reviewingTrade = false; render(); }
function setTradePartner(id) { const t = game.trade; t.to = id; t.get = []; t.getCash = 0; t.error = ''; t.stage = 'edit'; render(); }
function tradeBack() { const t = game.trade; t.stage = 'pick'; t.error = ''; render(); }
function toggleTradeProp(side, pos) {          // no redraw so the dialog does not jump
  const arr = game.trade[side], k = arr.indexOf(pos);
  if (k >= 0) arr.splice(k, 1); else arr.push(pos);
}
function tradeCash(side, v) { game.trade[side + 'Cash'] = Math.max(0, Math.floor(Number(v) || 0)); }
function cancelTrade() {
  const t = game.trade;
  if (t && t.stage === 'review') log(`${game.players[t.from].name} cancelled the trade with ${game.players[t.to].name}.`);
  if (t && !applyGameAction({ type: 'CANCEL_TRADE', playerId: t.from })) return;
  ui.reviewingTrade = false;
  render();
}
function validateTrade(t) {
  return tradeValidationMessage(MonopolyGameEngine.validateTrade(game, t, SPACES, MORTGAGE_INTEREST));
}
function tradeValidationMessage(validation) {
  if (!validation || !validation.code) return '';
  if (validation.code === 'EMPTY_OFFER') return 'Pick something to trade.';
  if (validation.code === 'INSUFFICIENT_GIVE_CASH' || validation.code === 'INSUFFICIENT_GET_CASH') {
    const p = game.players[validation.playerId];
    return `${p.name} only has ${fmt(validation.available)}.`;
  }
  if (validation.code === 'PROPERTY_NOT_TRADABLE') return 'One of those properties cannot be traded right now.';
  if (validation.code === 'GIVE_SIDE_CANNOT_PAY_FEE' || validation.code === 'GET_SIDE_CANNOT_PAY_FEE') {
    const p = game.players[validation.playerId];
    return `${p.name} cannot cover the ${fmt(validation.amount)} mortgage fee.`;
  }
  return 'That trade is no longer valid.';
}
function proposeTrade() {
  const t = game.trade;
  const result = applyGameAction({ type: 'PROPOSE_TRADE', playerId: t.from });
  if (!result) return;
  const rejected = result.events.find(event => event.type === 'TRADE_REJECTED');
  if (rejected) game.trade.error = tradeValidationMessage(rejected.validation);
  render();
}
// The receiver can leave a sent offer open indefinitely instead of
// deciding right away. While postponed, this trade still occupies the
// game's one trade slot (see openTrade/Trade button), so the receiver
// cannot be sent -- or start -- another trade until this one closes.
function postponeTrade() {
  const t = game.trade;
  if (!t || t.stage !== 'review') return;
  if (!applyGameAction({ type: 'POSTPONE_TRADE', playerId: t.to })) return;
  log(`${game.players[t.to].name} postponed the trade with ${game.players[t.from].name}.`);
  render();
}
function acceptTrade(now = Date.now()) {
  const t = game.trade;
  if (!t) return;
  const me = game.players[t.from], you = game.players[t.to];
  const names = arr => arr.length ? arr.map(spaceLabel).join(', ') : 'nothing';
  const trade = { give: t.give.slice(), giveCash: t.giveCash, get: t.get.slice(), getCash: t.getCash };
  const result = applyGameAction({ type: 'ACCEPT_TRADE', playerId: t.to, now, viewTradeMs: VIEW_TRADE_MS });
  if (!result) return;
  const rejected = result.events.find(event => event.type === 'TRADE_REJECTED');
  if (rejected) {
    game.trade.error = tradeValidationMessage(rejected.validation);
    render();
    return;
  }
  log(`Trade done. ${me.name} gives ${names(trade.give)}${trade.giveCash ? ' + ' + fmt(trade.giveCash) : ''}. ${you.name} gives ${names(trade.get)}${trade.getCash ? ' + ' + fmt(trade.getCash) : ''}.`);
  ui.reviewingTrade = false;
  render();
}
function declineTrade() {
  const t = game.trade;
  if (!t || !applyGameAction({ type: 'DECLINE_TRADE', playerId: t.to })) return;
  log(`${game.players[t.to].name} declined the trade.`);
  ui.reviewingTrade = false;
  render();
}

/* =====================================================================
   SECTION 12. MANAGE PROPERTIES, DEEDS AND PEEK
   Manage: the camera flies to each property you own. You can build
   houses and mortgage from there. Previous and Next cycle through them.
   Deeds: browse anyone's title deeds.
   Peek: click a square on the board to see its deed.
   ===================================================================== */
let noticeTimer = null;
function notify(text) {                       // a short message under the board
  ui.notice = text; render();
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { ui.notice = ''; if (game) render(); }, 2600);
}
function openManage() {
  // Gate on whose turn it is right here, in the function itself -- not
  // just in whichever button happens to call it. openManage() only
  // touches local ui state (it isn't synced through hostRun/act, since
  // it's a per-browser view, not shared game state), so a disabled
  // button alone wouldn't stop this from being invoked some other way
  // (a stale button reference, a keyboard shortcut, the console). This
  // check makes every call a no-op for anyone whose turn it isn't,
  // regardless of how the call happens, so the manage panel can never
  // be opened -- or its camera move triggered -- for the wrong player.
  const mine = isBackendAuthoritativeGame()
    ? backendCanManagePlayer(cur().id)
    : (!net.role || cur().id === net.myPid);
  if (!mine || !canManage() || ui.manage) return;
  if (!ownedSquares(cur().id).length) { notify('You do not own any properties yet.'); return; }
  ui.manage = { idx: 0, focused: -1 };
  render();
}
function manageStep(d) {
  const n = ownedSquares(cur().id).length;
  if (!ui.manage || !n) return;
  ui.manage.idx = (ui.manage.idx + d + n) % n;
  render();
}
function exitManage() { ui.manage = null; cameraReset(T(700)); render(); }
function manageSquare() {
  if (!ui.manage) return -1;
  const list = ownedSquares(cur().id);

function renderCells() {
  const focusSq = ui.manage ? manageSquare() : ui.peek;
  for (let i = 0; i < BOARD_SIZE; i++) {

      inner += `<div class="bar" style="background:${COLOR_GROUPS[s.group].css}">${marks}</div>`;
    } else {
      inner += `<div class="icon">${iconFor(s)}</div>`;
    }
    inner += `<div class="name">${esc(s.name)}</div>`;
    if (s.price) inner += `<div class="price">${fmt(s.price)}</div>`;
    if (s.type === 'tax') inner += `<div class="price">${fmt(s.amount)}</div>`;
    if (game.mortgaged[i]) inner += `<div class="mort-tag">Mortgaged</div>`;
    if (owner !== null) {
      const isNew = prevOwners && prevOwners[i] !== owner;
      const oColor = game.players[owner].color;
      const oInitial = esc((game.players[owner].name.trim().charAt(0) || '?').toUpperCase());
      inner += `<div class="owner-strip ${isNew ? 'fresh' : ''}" style="background:${oColor}"></div>`;
      inner += `<div class="owner-badge ${isNew ? 'fresh' : ''}" style="background:${oColor};color:${inkFor(oColor)}" title="Owned by ${esc(game.players[owner].name)}">${oInitial}</div>`;
    }
    el.innerHTML = `<div class="cell-in" style="transform:translate(-50%,-50%) rotate(${cellRot(i)}deg)">${inner}</div>`;
    el.classList.toggle('selected', focusSq === i);

    el.classList.toggle('owned', owner !== null);
    el.style.setProperty('--owner-color', owner !== null ? game.players[owner].color : 'transparent');

// For each square independently: start its name at full size, then only
// nudge that one square's font-size down, in small steps, until its text
// actually fits the square -- never touching any other square. This means
// a long custom property name shrinks just enough to fit, while every
// normal-length name (the vast majority) stays at full, readable size.
function fitCellNames() {
  const overflows = (cin) => cin.scrollHeight > cin.clientHeight + 1 || cin.scrollWidth > cin.clientWidth + 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const el = $('cell' + i);
    if (!el) continue;
    const cin = el.querySelector('.cell-in');
    const nameEl = el.querySelector('.name');
    if (!cin || !nameEl) continue;
    let scale = 1;
    nameEl.classList.remove('hyphenate');
    nameEl.style.setProperty('--nscale', scale);
    // Stop shrinking once the square's content fits its own fixed box,
    // or once we hit a floor that keeps text from becoming unreadably tiny.
    while (overflows(cin) && scale > 0.45) {
      scale = Math.round((scale - 0.05) * 100) / 100;
      nameEl.style.setProperty('--nscale', scale);
    }
    // Last resort: a single word still doesn't fit at the smallest normal
    // size (an unusually long custom name) -- allow a mid-word break so it
    // still fits its square, rather than spilling out of it.
    if (overflows(cin)) {
      nameEl.classList.add('hyphenate');
      while (overflows(cin) && scale > 0.35) {
        scale = Math.round((scale - 0.05) * 100) / 100;
        nameEl.style.setProperty('--nscale', scale);
      }
    }
  }
}

// Player pills across the top. Always laid out in turnOrder -- the fixed
// (randomly shuffled once, at game start) sequence of seat ids that `cur()`
// and `nextTurn()` also walk -- never in `game.players` seat/join order, so
// whoever rolls first is always shown first, second is shown second, and so
// on, the same way on every connected screen. `game.players[id]` (id is a
// stable seat number, not an array position) is what turns each turnOrder
// entry into the player object to render.
function updateHud() {
  $('hudPills').innerHTML = game.turnOrder.map((id, turnPos) => {
    const p = game.players[id];
    const owned = game.owners.filter(o => o === p.id).length;
    const diff = prevMoney[p.id] === undefined ? 0 : p.money - prevMoney[p.id];
    const initial = (p.name.trim().charAt(0) || String(p.id + 1)).toUpperCase();
    const offline = net.role && connStatus[p.id] === false;
    const flashCls = diff > 0 ? 'flash-up' : diff < 0 ? 'flash-down' : '';
    const popCls = diff > 0 ? 'pop-up' : diff < 0 ? 'pop-down' : '';
    return `<div class="pill ${p.id === cur().id && !game.over ? 'current' : ''} ${p.bankrupt ? 'out' : ''} ${flashCls}" id="pill${p.id}" style="--pc:${p.color}">
      <span class="order" title="${ordinal(turnPos + 1)} in turn order" aria-label="${ordinal(turnPos + 1)} in turn order">${turnPos + 1}</span>
      <span class="avatar">${esc(initial)}</span>
      <span class="ptext"><span class="pname">${esc(p.name)}${p.inJail ? ' (in jail)' : ''}${offline ? ' (offline)' : ''}</span><span class="pmoney ${popCls}">${fmt(p.money)}</span></span>
      <span class="badge" title="Properties owned" aria-label="${owned} properties owned">${owned}</span>
    </div>`;
  }).join('');
}

// The wooden shelf: manage, deeds, trade, and the main action button
function updateDock() {
  const p = cur();
  // Backend turn ownership governs only the migrated roll action. Other
  // controls retain their existing PeerJS seat permissions until migrated.
  const backendMode = isBackendAuthoritativeGame();
  const mine = !net.role || p.id === net.myPid;
  const debtMine = backendMode
    ? !!(game.debt && backendAccountControlsPlayer(game.debt.pid))
    : (!net.role || (game.debt && game.players[game.debt.pid].id === net.myPid));
  const idle = !busy && !popup && !game.over && !ui.manage &&
    (backendMode ? backendAccountControlsPlayer(p.id) : mine) && !authoritativeRollInFlight && !authoritativeActionInFlight;
  const rollIdle = !busy && !popup && !game.over && !ui.manage &&
    (backendMode ? backendRollIsLegal() : mine) && !authoritativeRollInFlight;
  const can = canManage() && !ui.manage && mine;
  const rollHandler = backendMode ? 'rollDice()' : "act('rollDice')";
  let primary = '';
  if (game.over) {
    primary = `<button class="primary" onclick="restart()">Play again</button>`;
  } else if (game.phase === 'roll') {
    const label = backendMode && authoritativeRollRequest ? 'Retry Roll' : 'Roll';
    primary = `<button class="primary" ${rollIdle ? '' : 'disabled'} onclick="${rollHandler}">${label} ${DICE_ICON}</button>`;
    if (p.inJail) primary += `<button class="dbtn" ${idle && p.money >= JAIL_FINE ? '' : 'disabled'} onclick="act('payJailFine')">Pay ${fmt(JAIL_FINE)} to leave jail</button>`;
  } else if (game.phase === 'after') {
    primary = `<button class="primary" ${idle ? '' : 'disabled'} onclick="act('endTurnClick')">End turn</button>`;
  } else if (game.phase === 'debt' && game.debt) {
    const dOk = !busy && !popup && !ui.manage && debtMine;
    primary = `<button class="primary" ${dOk && p.money >= game.debt.amount ? '' : 'disabled'} onclick="act('payDebt')">Pay ${fmt(game.debt.amount)}</button>
               <button class="dbtn" ${dOk ? '' : 'disabled'} onclick="act('declareBankruptcy')">${game.confirmBankrupt ? 'Really go bankrupt?' : 'Go bankrupt'}</button>`;
  } else {
    primary = `<button class="primary" disabled>${game.phase === 'buy' ? 'Buy or auction' : 'Auction'}</button>`;
  }
  $('dock').innerHTML = `
    <div class="dock-group props">
      <button class="dbtn" ${(backendMode ? backendCanManagePlayer(p.id) && !authoritativeActionInFlight : can) ? '' : 'disabled'} onclick="openManage()">Manage properties</button>
      <button class="dbtn" ${!busy && !popup && !game.over ? '' : 'disabled'} onclick="openDeeds()">View deeds</button>
      <button class="dbtn" ${can && !game.trade ? '' : 'disabled'} onclick="act('openTrade')">Trade</button>

}
// A postponed trade closes its own popup (see updateModal) so it doesn't

function tradeReviewBtnHTML() {
  const t = game.trade;

    ? (backendPlayerMine(t.from) || backendPlayerMine(t.to))

// Only the backend-authoritative host ever sees the Save Game control --
// this mirrors exactly the host check saveGame() itself enforces
// server-side, so this is purely a UX convenience, never the real gate.
function backendIsHostOfCurrentGame() {
  return !!(isBackendAuthoritativeGame() && accountUser && backendLobby &&
    window.authoritativeGame && backendLobby.gameId === window.authoritativeGame.gameId &&
    backendLobby.game && backendLobby.game.hostAccountId === accountUser.id);
}
let saveGameInFlight = false;
function updateSaveGameBtn() {
  const el = $('saveGameBtnHolder');
  if (!el) return;
  if (!game || game.over || !backendIsHostOfCurrentGame()) { el.innerHTML = ''; return; }
  el.innerHTML = `<button class="btn alt" ${saveGameInFlight ? 'disabled' : ''} onclick="openSaveGameDialog()">${saveGameInFlight ? 'Saving &amp; quitting...' : 'Save &amp; Quit'}</button>`;
}
function openSaveGameDialog() {
  if (saveGameInFlight) return;
  if (!window.confirm('Save this match and return everyone to the menu? The original players must all return before it can continue.')) return;
  backendSaveAndQuitGame(window.authoritativeGame.gameId);
}
async function backendSaveAndQuitGame(gameId) {
  if (!gameId || saveGameInFlight) return;
  saveGameInFlight = true;
  updateSaveGameBtn();
  try {
    const result = await backendGameRequest('/api/game/pause', {
      method: 'POST',
      body: JSON.stringify({ gameId, version: window.authoritativeGame.version }),
    });
    if (result.status !== 'PAUSED' || result.gameId !== gameId) {
      throw new Error('The server did not confirm that the match was saved and paused.');
    }
    await handleServerGamePaused(gameId, true);
  } catch (error) {
    setAccountStatus(`Save & Quit failed: ${error.message}`);
    window.alert(`Save & Quit failed. You are still in the match.\n\n${error.message}`);
  } finally {
    saveGameInFlight = false;
    updateSaveGameBtn();
  }
}

async function handleServerGamePaused(gameId, refreshGames = false) {
  if (window.authoritativeGame?.gameId !== gameId) return;
  stopBackendLobbyPolling();
  await window.authoritativeGame.clearAuthoritativeState();
  authoritativeAppliedGameId = null;
  game = null;
  busy = false;
  popup = null;
  stopGameTick();
  backendLobby = null;
  setup.screen = '';
  accountMessage = 'This match is paused. The original players can rejoin from My server games.';
  if (refreshGames) await refreshBackendMyGames();
  renderSetup();
}

    lines = [`${cur().name} owes ${fmt(game.debt.amount)} to ${to}. Mortgage or sell houses to raise cash.`];

  if (ui.notice) lines = [ui.notice];
  $('caption').innerHTML = lines.map(l => `<div>${esc(l)}</div>`).join('');
}

/* Manage overlay: dark panels in the corners of the scene, arrows to
   cycle through your properties, Exit at the top. */
function updateManage() {
  const box = $('manage');
  if (!ui.manage || game.over) { ui.manage = null; box.innerHTML = ''; return; }
  const sq = manageSquare();
  if (sq < 0) { ui.manage = null; box.innerHTML = ''; cameraReset(); return; }
  // Same turn gate as updateDock: without this, a player's manage panel
  // left open across a turn change (or, in online play, anyone else's
  // panel) would show build/mortgage buttons that look clickable but
  // are always silently rejected by the host (see hostOwnershipOK) --
  // confusing when they should just look disabled instead.
  const p = cur(), s = { ...SPACES[sq], name: spaceLabel(sq) }, list = ownedSquares(p.id);
  const mine = isBackendAuthoritativeGame()
    ? backendCanManagePlayer(p.id)
    : (!net.role || p.id === net.myPid);
  const can = canManage() && mine && !authoritativeActionInFlight;
  // Cycling with Previous/Next should feel almost instant, not like the
  // slower camera moves elsewhere, so this uses a short fixed time
  // instead of T(...) (which would stretch it with ANIM_SCALE).
  if (ui.manage.focused !== sq) { ui.manage.focused = sq; cameraFocus(sq, reduceMotion ? 0 : 90, 'close'); }
  let housesPanel;
  if (s.type === 'property') {
    const h = game.houses[sq];
    // Explain *why* the + button is greyed out, not just that it is --
    // every disabled reason canBuild() can hit gets its own message,
    // otherwise "build evenly" reads as a stuck/buggy button instead of
    // the real rule it is: build your other properties in this set up
    // to the same level before this one can go again.
    let hint = 'Houses sell for half price.';
    if (!ownsFullSet(p.id, s.group)) hint = 'Own the full color set to build.';
    else if (groupHasMortgage(s.group)) hint = 'Unmortgage the whole set to build.';
    else if (h >= 5) hint = 'Already a hotel -- that is the maximum.';
    else if (can && p.money < s.houseCost) hint = `You need ${fmt(s.houseCost)} to build here.`;
    housesPanel = `<h3>Houses</h3>
      <div class="line">Current: ${h === 5 ? houseSVG(0, true) + ' hotel' : houseSVG(h, false) + ' ' + h}</div>
      <div class="line">
        <button class="mg-btn" title="Sell a house" onclick="act('sellHouse', ${sq})" ${can && canSell(sq, p.id) ? '' : 'disabled'}>-</button>
        <span>${fmt(s.houseCost)}</span>
        <button class="mg-btn plus" title="Build a house" onclick="act('buildHouse', ${sq})" ${can && canBuild(sq, p.id) ? '' : 'disabled'}>+</button>
      </div><div class="small">${hint}</div>`;
  } else {
    housesPanel = `<h3>Houses</h3><div class="line small">You cannot build on this kind of square.</div>`;
  }
  const mort = game.mortgaged[sq];
  const mortPanel = `<h3>Mortgage</h3>
    <div class="line">Status:</div>
    <div class="line ${mort ? 'badc' : 'good'}">${mort ? 'Mortgaged' : 'Unmortgaged'}</div>
    <div class="line">${mort
      ? `<button class="mg-btn mort-btn" onclick="act('unmortgage', ${sq})" ${can && p.money >= unmortgageCost(sq) ? '' : 'disabled'}>Unmortgage</button><span>${fmt(unmortgageCost(sq))}</span>`
      : `<button class="mg-btn mort-btn" onclick="act('mortgage', ${sq})" ${can && canMortgage(sq, p.id) ? '' : 'disabled'}>Mortgage</button><span>${fmt(mortgageValue(sq))}</span>`}</div>
    ${!mort && s.type === 'property' && groupHasHouses(s.group) ? '<div class="small">Sell all houses in this color first.</div>' : ''}`;
  box.innerHTML = `
    <div class="mg-title">${esc(s.name)} (${ui.manage.idx + 1} of ${list.length})</div>
    <button class="mg-exit" onclick="exitManage()">Exit</button>
    <button class="mg-arrow left" onclick="manageStep(1)">&lt; Next</button>
    <button class="mg-arrow right" onclick="manageStep(-1)">Previous &gt;</button>
    <div class="mg-panel houses">${housesPanel}</div>
    <div class="mg-panel mort">${mortPanel}</div>`;
}

/* ---- Title deed cards (paper white, like the real ones) ---- */
function houseSVG(n, red) {

}
function deedHTML(pos) {

      <div class="r"><span>If 3 are owned</span><b>$100</b></div><div class="r"><span>If 4 are owned</span><b>$200</b></div>`;

// A visual chip row for one side of a trade offer -- a colored swatch per
// property (matching its group, just like the deed cards) plus a cash
// chip, used everywhere a trade is reviewed (sent, postponed, or done).
function tradeChips(props, cash) {
  const chips = props.map(i => {
    const s = { ...SPACES[i], name: spaceLabel(i) }, color = s.type === 'property' ? COLOR_GROUPS[s.group].css : '#8a8a8a';
    return `<div class="trade-chip"><span class="swatch" style="background:${color}"></span>${esc(s.name)}${game.mortgaged[i] ? ' <span class="tag">mortgaged</span>' : ''}</div>`;
  });
  if (cash) chips.push(`<div class="trade-chip cash">${fmt(cash)}</div>`);
  return `<div class="trade-visual">${chips.length ? chips.join('') : '<div class="trade-chip empty">Nothing</div>'}</div>`;
}
function propRows(pid, side, selected, editable) {
  const rows = [];
  for (let i = 0; i < BOARD_SIZE; i++) {
    if (game.owners[i] !== pid) continue;
    const s = { ...SPACES[i], name: spaceLabel(i) }, ok = editable && tradable(i, pid), color = s.type === 'property' ? COLOR_GROUPS[s.group].css : '#8a8a8a';
    rows.push(`<label class="chk"><input type="checkbox" ${selected.includes(i) ? 'checked' : ''} ${ok ? '' : 'disabled'} onchange="toggleTradeProp('${side}', ${i})">
      <span class="swatch" style="background:${color}"></span><span>${esc(s.name)}</span>
      ${game.mortgaged[i] ? '<span class="tag">mortgaged</span>' : ''}${ok || !editable ? '' : '<span class="tag">has houses</span>'}</label>`);
  }
  return rows.length ? rows.join('') : '<div class="muted">No properties.</div>';
}
function tradeHTML() {
  const t = game.trade, me = game.players[t.from];
  // Turn/party gate for the trade dialog: everyone sees the same trade
  // in progress, but only the person it's actually waiting on gets

  // pass-and-play (no net.role) skips this, same as everywhere else.
  const proposerMine = isBackendAuthoritativeGame()
    ? backendPlayerMine(me.id)

    const opts = game.players.filter(q => q.id !== me.id && !q.bankrupt)

             <button class="btn alt" onclick="act('declineTrade')">Decline</button></div>
             <div class="row"><button class="btn alt" onclick="closeTradeReview()">Close</button></div>`
          : proposerMine
            ? `<p class="muted" style="text-align:center">Trade Postponed &mdash; ${esc(you.name)} hasn't decided yet.</p>
               <div class="row"><button class="btn alt" onclick="act('cancelTrade')">Cancel trade</button></div>
               <div class="row"><button class="btn alt" onclick="closeTradeReview()">Close</button></div>`
            : `<p class="muted" style="text-align:center">Trade Postponed.</p>
               <div class="row"><button class="btn alt" onclick="closeTradeReview()">Close</button></div>`}`;
    }

      <div class="muted" style="text-align:center">A mortgaged square costs its new owner a 10 percent fee to the bank.</div>
      ${recipientMine ? '' : `<p class="muted" style="text-align:center">Waiting for ${esc(you.name)} to decide...</p>`}
      <div class="row"><button class="btn" ${recipientMine ? '' : 'disabled'} onclick="act('acceptTrade', Date.now())">Accept</button>
      <button class="btn alt" ${recipientMine ? '' : 'disabled'} onclick="act('declineTrade')">Decline</button>
      <button class="btn alt" ${recipientMine ? '' : 'disabled'} onclick="act('postponeTrade')">Postpone</button></div>`;
  }
  return `<div class="dlg-head"><h2>Trade with ${esc(you.name)}</h2><button class="btn alt" ${proposerMine ? '' : 'disabled'} onclick="act('tradeBack')">Change player</button></div>

    ${proposerMine ? '' : `<p class="muted" style="text-align:center">Waiting for ${esc(me.name)} to send an offer...</p>`}
    <div class="row"><button class="btn" ${proposerMine ? '' : 'disabled'} onclick="actProposeTrade()">Send offer to ${esc(you.name)}</button>
    <button class="btn alt" ${proposerMine ? '' : 'disabled'} onclick="act('cancelTrade')">Cancel</button></div>`;
}

let backendFinalResults = null;
let backendFinalResultsGameId = null;
let backendFinalResultsInFlight = null;
// The authoritative placements/money/net worth always come from GET
// /api/game/results -- the client never computes or guesses them. Falls
// back to the plain winner-only text (below, in updateModal) if the
// fetch hasn't resolved yet or this isn't a backend-authoritative game.
async function fetchBackendFinalResults(gameId) {
  if (!gameId || backendFinalResultsGameId === gameId || backendFinalResultsInFlight === gameId) return;
  backendFinalResultsInFlight = gameId;
  try {
    const result = await backendGameRequest(`/api/game/results?gameId=${encodeURIComponent(gameId)}`);
    backendFinalResults = result;
    backendFinalResultsGameId = gameId;
    render();
  } catch (error) {
    console.warn('Could not load final results:', error);

    if (backendFinalResultsInFlight === gameId) backendFinalResultsInFlight = null;

}
